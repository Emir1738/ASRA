  <title>Asra Chat</title>
  <style>
@charset "UTF-8";

:root {
  color-scheme: dark;
  --bg: #090b10;
  --bg-soft: #0f1219;
  --surface: rgba(20, 24, 34, .94);
  --surface-strong: #171b25;
  --surface-hover: #202635;
  --field: #0e1118;
  --text: #f6f7fb;
  --muted: #98a1b2;
  --faint: #687184;
  --line: rgba(255, 255, 255, .09);
  --accent: #7d8cff;
  --accent-strong: #6576fb;
  --accent-soft: rgba(125, 140, 255, .14);
  --success: #43c98d;
  --warning: #f2b84b;
  --danger: #ef6472;
  --own-bubble: #4657d8;
  --other-bubble: #1a1f2b;
  --shadow: 0 24px 70px rgba(0, 0, 0, .42);
  --radius: 20px;
  --header-height: 72px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

html[data-theme="light"] {
  color-scheme: light;
  --bg: #f2f4f9;
  --bg-soft: #e9edf5;
  --surface: rgba(255, 255, 255, .96);
  --surface-strong: #fff;
  --surface-hover: #eef1f8;
  --field: #f7f8fb;
  --text: #171a22;
  --muted: #636c7d;
  --faint: #8a92a1;
  --line: rgba(20, 27, 43, .11);
  --accent: #5366e8;
  --accent-strong: #4054d9;
  --accent-soft: rgba(83, 102, 232, .1);
  --own-bubble: #5265e4;
  --other-bubble: #fff;
  --shadow: 0 24px 65px rgba(38, 48, 74, .15);
}

* { box-sizing: border-box; }
html { min-height: 100%; background: var(--bg); }
body {
  min-width: 320px;
  min-height: 100vh;
  margin: 0;
  overflow-x: hidden;
  color: var(--text);
  background:
    radial-gradient(circle at 15% -10%, rgba(88, 103, 224, .15), transparent 34rem),
    radial-gradient(circle at 100% 100%, rgba(73, 195, 161, .06), transparent 32rem),
    var(--bg);
  -webkit-font-smoothing: antialiased;
}
body.modal-open { overflow: hidden; }
button, input, textarea, select { font: inherit; }
button { color: inherit; }
button:not(:disabled) { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .55; }
button.temporarily-locked { cursor: wait; opacity: .68; filter: saturate(.78); }
img { max-width: 100%; }
[hidden] { display: none !important; }
::selection { color: #fff; background: var(--accent); }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; }

.visually-hidden {
  position: fixed !important;
  width: 1px !important;
  height: 1px !important;
  overflow: hidden !important;
  clip: rect(0, 0, 0, 0) !important;
  white-space: nowrap !important;
}
.muted { color: var(--muted); }
.eyebrow {
  margin: 0 0 5px;
  color: var(--accent);
  font-size: .7rem;
  font-weight: 800;
  letter-spacing: .14em;
}

.loading-overlay {
  position: fixed;
  z-index: 1000;
  inset: 0;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: 9px;
  padding: 24px;
  text-align: center;
  background: rgba(6, 8, 12, .94);
  backdrop-filter: blur(16px);
}
.loading-logo {
  width: 148px;
  height: 142px;
  margin-bottom: 8px;
  border: 1px solid rgba(255, 255, 255, .08);
  border-radius: 34px;
  object-fit: cover;
  animation: logo-spin 3s cubic-bezier(.55, 0, .35, 1) infinite;
  box-shadow: 0 24px 65px rgba(0, 0, 0, .5), 0 0 0 10px rgba(125, 140, 255, .04);
}
.loading-overlay strong { font-size: 1.2rem; }
.loading-overlay > span:not(.loading-dots) { color: #9aa3b5; font-size: .9rem; }
.loading-dots { display: flex; gap: 5px; margin-top: 10px; }
.loading-dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: dot-bounce 1s infinite ease-in-out; }
.loading-dots i:nth-child(2) { animation-delay: .12s; }
.loading-dots i:nth-child(3) { animation-delay: .24s; }
@keyframes logo-spin { 0% { transform: rotate(0deg) scale(.94); } 50% { transform: rotate(180deg) scale(1); } 100% { transform: rotate(360deg) scale(.94); } }
@keyframes dot-bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .35; } 30% { transform: translateY(-6px); opacity: 1; } }

.auth-screen {
  display: grid;
  min-height: 100vh;
  place-items: center;
  padding: 32px 18px;
}
.auth-card {
  width: min(100%, 510px);
  padding: clamp(22px, 5vw, 38px);
  border: 1px solid var(--line);
  border-radius: 28px;
  background: linear-gradient(145deg, color-mix(in srgb, var(--surface) 96%, transparent), var(--surface));
  box-shadow: var(--shadow);
  backdrop-filter: blur(24px);
}
.brand-lockup { display: flex; align-items: center; gap: 18px; margin-bottom: 30px; }
.auth-logo-wrap {
  flex: 0 0 auto;
  width: 96px;
  height: 96px;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 24px;
  background: #0d0d0d;
  box-shadow: 0 14px 35px rgba(0, 0, 0, .28);
}
.auth-logo { width: 100%; height: 100%; object-fit: cover; }
.brand-lockup h1 { margin: 0; font-size: clamp(1.75rem, 6vw, 2.25rem); letter-spacing: -.045em; }
.brand-lockup .muted { margin: 8px 0 0; font-size: .92rem; line-height: 1.5; }
.auth-form { display: grid; gap: 10px; }
.auth-form + .auth-form { margin-top: 18px; }
.auth-form label, .form-field label { color: var(--muted); font-size: .8rem; font-weight: 750; }
input, textarea, select {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 13px;
  color: var(--text);
  background: var(--field);
  transition: border-color .18s, box-shadow .18s, background .18s;
}
input, select { min-height: 48px; padding: 0 14px; }
textarea { min-height: 110px; padding: 13px 14px; line-height: 1.5; resize: vertical; }
input:hover, textarea:hover, select:hover { border-color: color-mix(in srgb, var(--accent) 38%, var(--line)); }
input:focus, textarea:focus, select:focus { border-color: var(--accent); outline: 0; box-shadow: 0 0 0 4px var(--accent-soft); }
.field-with-action { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 9px; }
.password-field { position: relative; }
.password-field input { padding-right: 72px; }
.password-toggle { position: absolute; top: 50%; right: 8px; transform: translateY(-50%); }
.field-note { margin: -2px 0 7px; color: var(--faint); font-size: .75rem; line-height: 1.45; }
.auth-options { margin-top: 24px; padding-top: 22px; border-top: 1px solid var(--line); }
.segmented-control { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-bottom: 20px; padding: 5px; border-radius: 14px; background: var(--field); }
.segment { min-height: 40px; border: 0; border-radius: 10px; color: var(--muted); background: transparent; font-weight: 750; }
.segment.active { color: var(--text); background: var(--surface-hover); box-shadow: 0 5px 15px rgba(0, 0, 0, .12); }

.primary-button, .secondary-button, .danger-button, .ghost-button {
  display: inline-flex;
  min-height: 44px;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 0 17px;
  border: 1px solid transparent;
  border-radius: 12px;
  font-weight: 760;
  transition: transform .15s, filter .15s, border-color .15s, background .15s;
}
.primary-button { color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-strong)); box-shadow: 0 9px 22px color-mix(in srgb, var(--accent) 25%, transparent); }
.primary-button:hover { filter: brightness(1.08); transform: translateY(-1px); }
.secondary-button { border-color: var(--line); color: var(--text); background: var(--surface-hover); }
.secondary-button:hover, .ghost-button:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); background: var(--accent-soft); }
.danger-button { color: #fff; background: var(--danger); }
.ghost-button { border-color: var(--line); color: var(--muted); background: transparent; }
.full { width: 100%; margin-top: 8px; }
.icon-text-button { min-height: 32px; padding: 0 8px; border: 0; border-radius: 8px; color: var(--accent); background: transparent; font-size: .76rem; font-weight: 750; }
.icon-text-button:hover { background: var(--accent-soft); }

.app-shell { min-height: 100vh; }
.update-nudge {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; margin: 0 0 8px;
  border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line));
  background: var(--accent-soft); color: var(--text);
  border-radius: 10px; font-size: .72rem; line-height: 1.35;
}
.update-nudge button {
  margin-left: auto; min-height: 26px; padding: 0 10px; flex: 0 0 auto;
  border: 1px solid var(--line); border-radius: 7px; background: var(--field);
  color: var(--muted); font-size: .68rem; font-weight: 700;
}
.update-nudge button:hover { color: var(--text); }
.app-header {
  position: fixed;
  z-index: 100;
  inset: 0 0 auto;
  display: flex;
  height: var(--header-height);
  align-items: center;
  gap: 10px;
  padding: 9px max(16px, calc((100vw - 1180px) / 2));
  border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg) 78%, transparent);
  backdrop-filter: blur(24px) saturate(140%);
}
.header-brand { display: flex; min-width: 0; align-items: center; gap: 11px; padding: 0; border: 0; text-align: left; background: transparent; }
.header-brand img { width: 48px; height: 48px; flex: 0 0 auto; border-radius: 13px; object-fit: cover; background: #0c0c0c; }
.header-brand span { display: grid; min-width: 0; }
.header-brand strong { overflow: hidden; font-size: .96rem; text-overflow: ellipsis; white-space: nowrap; }
.header-brand small { overflow: hidden; margin-top: 2px; color: var(--muted); font-size: .7rem; text-overflow: ellipsis; white-space: nowrap; }
.header-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.round-button {
  display: grid;
  width: 42px;
  height: 42px;
  flex: 0 0 auto;
  place-items: center;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 50%;
  color: var(--muted);
  background: var(--surface);
  transition: color .15s, background .15s, transform .15s;
}
.round-button:hover { color: var(--text); background: var(--surface-hover); transform: translateY(-1px); }
.round-button svg { width: 21px; height: 21px; fill: currentColor; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.connection-state { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: .72rem; }
.connection-state i { width: 7px; height: 7px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 4px color-mix(in srgb, var(--success) 12%, transparent); }
.connection-state.offline i { background: var(--danger); }
.account-menu {
  position: absolute;
  top: calc(100% - 2px);
  right: max(16px, calc((100vw - 1180px) / 2));
  width: 220px;
  padding: 8px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--surface-strong);
  box-shadow: var(--shadow);
}
.account-menu button { display: flex; width: 100%; min-height: 42px; align-items: center; gap: 11px; padding: 0 11px; border: 0; border-radius: 10px; text-align: left; background: transparent; }
.account-menu button:hover { background: var(--surface-hover); }
.account-menu button span { width: 18px; color: var(--accent); text-align: center; }
.account-menu hr { margin: 6px 4px; border: 0; border-top: 1px solid var(--line); }
.danger-text { color: var(--danger) !important; }
.app-view { width: min(1180px, 100%); min-height: 100vh; margin: 0 auto; padding: calc(var(--header-height) + 30px) 18px calc(36px + var(--safe-bottom)); }

.page-heading { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
.page-heading h1 { margin: 0; font-size: clamp(1.7rem, 4vw, 2.65rem); letter-spacing: -.045em; }
.page-heading p:not(.eyebrow) { max-width: 640px; margin: 8px 0 0; color: var(--muted); line-height: 1.5; }
.room-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 13px; }
.room-card {
  position: relative;
  min-height: 155px;
  overflow: hidden;
  padding: 20px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  text-align: left;
  background: linear-gradient(145deg, var(--surface), color-mix(in srgb, var(--surface) 88%, var(--accent-soft)));
  box-shadow: 0 10px 30px rgba(0, 0, 0, .08);
  transition: transform .18s, border-color .18s, box-shadow .18s;
}
.room-card::after { position: absolute; right: -28px; bottom: -42px; width: 112px; height: 112px; border-radius: 50%; background: var(--accent-soft); content: ""; }
.room-card:hover { z-index: 1; border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); transform: translateY(-3px); box-shadow: 0 18px 35px rgba(0, 0, 0, .14); }
.room-card-index { display: grid; width: 36px; height: 36px; place-items: center; margin-bottom: 21px; border-radius: 11px; color: var(--accent); background: var(--accent-soft); font-size: .76rem; font-weight: 850; }
.room-card strong { display: block; margin-bottom: 7px; font-size: 1rem; }
.room-card small { display: -webkit-box; overflow: hidden; color: var(--muted); line-height: 1.45; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

.app-view.chat-mode {
  width: min(1120px, 100%);
  padding: calc(var(--header-height) + 14px) 14px 14px;
}
.ui-icon {
  width: 20px;
  height: 20px;
  flex: 0 0 auto;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.9;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.chat-layout {
  position: relative;
  isolation: isolate;
  display: grid;
  width: 100%;
  height: calc(100dvh - var(--header-height) - 28px);
  min-height: 540px;
  grid-template-rows: auto minmax(0, 1fr) auto;
  overflow: hidden;
  border: 1px solid color-mix(in srgb, var(--accent) 15%, var(--line));
  border-radius: 28px;
  background: var(--surface);
  box-shadow: 0 24px 80px rgba(0, 0, 0, .28), inset 0 1px rgba(255, 255, 255, .025);
}
.room-notice {
  z-index: 2;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 13px;
  min-height: 76px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--surface-strong) 92%, transparent);
  backdrop-filter: blur(18px);
}
.notice-icon {
  display: grid;
  width: 42px;
  height: 42px;
  place-items: center;
  border: 1px solid color-mix(in srgb, var(--success) 28%, var(--line));
  border-radius: 14px;
  color: var(--success);
  background: color-mix(in srgb, var(--success) 10%, transparent);
}
.notice-icon .ui-icon { width: 22px; height: 22px; }
.notice-copy { min-width: 0; }
.notice-copy strong { display: block; margin: 0 0 4px; font-size: .83rem; letter-spacing: -.01em; }
.notice-copy .notice-rule { display: block; overflow: hidden; color: var(--muted); font-size: .72rem; line-height: 1.35; text-overflow: ellipsis; white-space: nowrap; }
.retention-panel { display: flex; align-items: center; gap: 8px; min-width: 0; }
.retention-panel .countdown {
  display: flex;
  min-height: 34px;
  align-items: center;
  gap: 7px;
  padding: 0 10px;
  border: 1px solid color-mix(in srgb, var(--warning) 22%, var(--line));
  border-radius: 999px;
  color: var(--warning) !important;
  background: color-mix(in srgb, var(--warning) 7%, transparent);
  font-size: .68rem;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  /* Dar ekranda metin kırpılıp yarısı görünüyordu: hap artık YATAY
     KAYDIRILABİLİR, parmakla çekince tamamı okunur. */
  min-width: 0;
  max-width: 100%;
  overflow-x: auto;
  overflow-y: hidden;
  overscroll-behavior-x: contain;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
}
.retention-panel .countdown::-webkit-scrollbar { height: 4px; }
.retention-panel .countdown::-webkit-scrollbar-thumb { border-radius: 999px; background: color-mix(in srgb, var(--warning) 45%, transparent); }
.retention-panel .countdown .ui-icon { width: 15px; height: 15px; }
.retention-help { min-height: 34px; padding: 0 10px; border: 0; border-radius: 10px; color: var(--accent); background: transparent; font-size: .72rem; font-weight: 780; }
.retention-help:hover { background: var(--accent-soft); }
.message-list {
  position: relative;
  overflow-x: hidden;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 24px clamp(14px, 3.5vw, 38px) 30px;
  scroll-behavior: smooth;
  scrollbar-color: color-mix(in srgb, var(--accent) 35%, transparent) transparent;
  scrollbar-width: thin;
  background:
    radial-gradient(circle at 18% 5%, color-mix(in srgb, var(--accent) 6%, transparent), transparent 22rem),
    radial-gradient(circle at 88% 95%, color-mix(in srgb, var(--success) 4%, transparent), transparent 24rem),
    linear-gradient(180deg, color-mix(in srgb, var(--bg-soft) 68%, transparent), color-mix(in srgb, var(--bg) 78%, transparent));
}
.message-list::-webkit-scrollbar { width: 7px; }
.message-list::-webkit-scrollbar-thumb { border-radius: 999px; background: color-mix(in srgb, var(--accent) 28%, transparent); }
.empty-state { display: grid; min-height: 100%; place-content: center; justify-items: center; padding: 30px; text-align: center; color: var(--muted); }
.empty-state-icon { display: grid; width: 62px; height: 62px; place-items: center; margin-bottom: 14px; border: 1px solid color-mix(in srgb, var(--accent) 25%, var(--line)); border-radius: 20px; color: var(--accent); background: var(--accent-soft); font-size: 1.5rem; box-shadow: 0 12px 30px color-mix(in srgb, var(--accent) 10%, transparent); }
.empty-state h3 { margin: 0 0 7px; color: var(--text); }
.empty-state p { max-width: 360px; margin: 0; font-size: .86rem; line-height: 1.5; }
.date-divider {
  position: sticky;
  z-index: 3;
  top: 8px;
  display: flex;
  justify-content: center;
  margin: 5px 0 11px;
  pointer-events: none;
}
.date-divider span {
  padding: 6px 11px;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--muted);
  background: color-mix(in srgb, var(--surface-strong) 88%, transparent);
  box-shadow: 0 6px 18px rgba(0, 0, 0, .12);
  backdrop-filter: blur(14px);
  font-size: .66rem;
  font-weight: 760;
}
.message-row { display: flex; align-items: flex-end; gap: 9px; margin: 4px 0; }
.message-row.grouped { margin-top: -1px; }
.message-row.own { flex-direction: row-reverse; }
.message-avatar, .profile-avatar { display: grid; flex: 0 0 auto; place-items: center; border: 0; border-radius: 50%; color: #fff; font-weight: 850; text-transform: uppercase; }
.message-avatar { width: 34px; height: 34px; border: 2px solid color-mix(in srgb, var(--surface-strong) 82%, transparent); box-shadow: 0 5px 15px rgba(0, 0, 0, .18); font-size: .73rem; }
.message-row.grouped .message-avatar { visibility: hidden; }
.message-row.own .message-avatar { display: none; }
.avatar-c1 { background: #5b6cf9; } .avatar-c2 { background: #7c4dff; } .avatar-c3 { background: #009688; } .avatar-c4 { background: #e85d75; }
.avatar-c5 { background: #f08c46; } .avatar-c6 { background: #2e86de; } .avatar-c7 { background: #8e5cba; } .avatar-c8 { background: #2d9c6f; }
.bubble-wrap { width: fit-content; max-width: min(72%, 680px); }
.message-bubble {
  position: relative;
  min-width: 112px;
  padding: 10px 13px 8px;
  border: 1px solid var(--line);
  border-radius: 8px 19px 19px 19px;
  background: color-mix(in srgb, var(--other-bubble) 96%, transparent);
  box-shadow: 0 6px 18px rgba(0, 0, 0, .1);
  cursor: pointer;
  transition: border-color .16s, transform .16s, box-shadow .16s;
}
.message-bubble:hover { border-color: color-mix(in srgb, var(--accent) 25%, var(--line)); box-shadow: 0 9px 24px rgba(0, 0, 0, .14); }
.message-row.grouped:not(.own) .message-bubble { border-top-left-radius: 15px; }
.message-row.own .message-bubble { color: #fff; border-color: rgba(255, 255, 255, .09); border-radius: 19px 8px 19px 19px; background: linear-gradient(145deg, #5668e9, #4052ce); box-shadow: 0 8px 22px rgba(51, 69, 193, .2); }
.message-row.own.grouped .message-bubble { border-top-right-radius: 15px; }

.image-zoom-overlay { position: fixed; z-index: 900; inset: 0; display: grid; place-items: center; background: rgba(4, 6, 12, .95); touch-action: none; animation: modal-in .16s ease-out; }

.image-zoom-close { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 14px); right: 16px; display: grid; width: 46px; height: 46px; place-items: center; border: 1px solid rgba(255, 255, 255, .16); border-radius: 50%; color: #fff; background: rgba(255, 255, 255, .12); font-size: 1.15rem; font-weight: 800; }

.toast { display: flex; align-items: flex-start; gap: 10px; padding: 13px 14px; border: 1px solid var(--line); border-radius: 13px; background: var(--surface-strong); box-shadow: var(--shadow); animation: toast-in .2s ease-out; pointer-events: auto; }

.skeleton { position: relative; overflow: hidden; border-radius: 12px; background: var(--surface-hover); }

.room-card { --room-accent: var(--accent); border-radius: 22px; background: linear-gradient(150deg, color-mix(in srgb, var(--surface) 96%, var(--room-accent)), var(--surface)); }

/* Bilgi Odası: yıldızlı, dikkat çekici özel kart */
.room-card-info { --room-accent: #f5a623; border-color: color-mix(in srgb, #f5a623 55%, var(--line)); background:
  radial-gradient(130% 150% at 100% 0%, color-mix(in srgb, #f97316 24%, transparent), transparent 55%),
  radial-gradient(130% 150% at 0% 100%, color-mix(in srgb, #8b5cf6 22%, transparent), transparent 55%),

  box-shadow: 0 10px 30px rgba(0, 0, 0, .08), 0 0 0 1px color-mix(in srgb, #f5a623 20%, transparent), 0 12px 26px color-mix(in srgb, #f5a623 18%, transparent); }
.room-card-info::before { width: 4px; background: linear-gradient(180deg, #f5a623, #ef4444 62%, #8b5cf6); opacity: .95; }

.room-card-info .room-card-index { color: #fff; background: linear-gradient(135deg, #f59e0b, #ef4444); box-shadow: 0 6px 14px rgba(245, 158, 11, .35); }

  .announcement-icon { width: 34px; height: 34px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
/* Hesap ve cihaz güvenliği */
.device-account-notice {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin: 0 0 15px;
  padding: 12px 13px;
  border: 1px solid color-mix(in srgb, var(--warning) 28%, var(--line));
  border-radius: 13px;
  color: var(--muted);
  background: color-mix(in srgb, var(--warning) 7%, transparent);
  font-size: .78rem;
  line-height: 1.45;
}
.device-account-notice .ui-icon { width: 19px; height: 19px; color: var(--warning); }

/* Mesajlarda tek dokunuşla işlem; yerel kopyalama/medya menüsü kapalıdır. */
.message-bubble,
.message-bubble *:not(button),
.message-image {
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}
.message-image { cursor: pointer; }
.message-actions-button {
  position: absolute;
  z-index: 2;
  top: 5px;
  right: 5px;
  display: grid;
  width: 28px;
  height: 28px;
  place-items: center;
  padding: 0;
  border: 0;
  border-radius: 9px;
  color: var(--muted);
  background: color-mix(in srgb, var(--surface-strong) 88%, transparent);
  opacity: 0;
  transform: translateY(-2px);
  transition: opacity .14s, transform .14s, background .14s;
}
.message-actions-button .ui-icon { width: 17px; height: 17px; }
.message-bubble:hover .message-actions-button,
.message-bubble:focus-within .message-actions-button,
.message-actions-button:focus-visible { opacity: 1; transform: translateY(0); }
.message-row.own .message-actions-button { color: rgba(255, 255, 255, .82); background: rgba(18, 28, 94, .35); }
.message-bubble:has(.message-actions-button) .message-author { padding-right: 25px; }

/* Yönetim paneli */
.admin-user-actions { justify-content: flex-end; }
.admin-delete-button { background: transparent; border-color: color-mix(in srgb, var(--danger) 55%, transparent); color: var(--danger); }
.admin-delete-button:hover { color: #fff; background: var(--danger); }
.admin-critical-warning {
  padding: 11px 12px;
  border: 1px solid color-mix(in srgb, var(--danger) 35%, var(--line));
  border-radius: 12px;
  color: var(--danger);
  background: color-mix(in srgb, var(--danger) 8%, transparent);
  font-size: .76rem;
  font-weight: 700;
  line-height: 1.45;
}
@media (hover: none), (max-width: 700px) {
  .message-actions-button { opacity: .82; transform: none; }
  .message-bubble { padding-right: 35px; }
  .message-row.own .message-bubble { padding-left: 12px; padding-right: 35px; }
  .admin-user-actions { justify-content: flex-start; }
  .admin-user-actions button { flex: 1 1 auto; }
}

/* Kurumsal mesaj silme ve 4 saniyelik geri alma akışı */
.delete-policy-note {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-top: 16px;
  padding: 11px 12px;
  border: 1px solid color-mix(in srgb, var(--danger) 24%, var(--line));
  border-radius: 12px;
  color: var(--muted);
  background: color-mix(in srgb, var(--danger) 6%, transparent);
  font-size: .76rem;
  line-height: 1.45;
}
.delete-policy-note .ui-icon { width: 18px; height: 18px; color: var(--danger); }
.single-delete-action .danger-button { width: 100%; }
.undo-delete-toast {
  position: relative;
  align-items: center;
  overflow: hidden;
  padding: 14px 14px 17px;
}
.undo-delete-toast::before { display: none; }
.undo-delete-copy { display: grid; min-width: 0; flex: 1; gap: 2px; }
.undo-delete-copy strong { font-size: .82rem; }
.undo-delete-copy span { overflow: hidden; color: var(--muted); font-size: .7rem; text-overflow: ellipsis; white-space: nowrap; }
.undo-delete-button {
  min-height: 34px;
  flex: 0 0 auto;
  padding: 0 10px;
  border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line));
  border-radius: 9px;
  color: var(--accent);
  background: var(--accent-soft);
  font-size: .72rem;
  font-weight: 820;
}
.undo-delete-progress {
  position: absolute;
  right: 0;
  bottom: 0;
  left: 0;
  height: 3px;
  transform-origin: left;
  background: var(--warning);
  animation: undo-delete-countdown 4s linear forwards;
}
@keyframes undo-delete-countdown { from { transform: scaleX(1); } to { transform: scaleX(0); } }
/* Kullanıcıya özel oda bildirimleri */
.room-card.has-unread {
  border-color: color-mix(in srgb, var(--room-accent) 58%, var(--line));
  box-shadow: 0 15px 34px color-mix(in srgb, var(--room-accent) 10%, transparent);
}
.room-card-notification {
  position: relative;
  z-index: 2;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 8px;
  margin-top: 15px;
  padding: 9px 10px;
  border: 1px solid color-mix(in srgb, var(--room-accent) 28%, var(--line));
  border-radius: 12px;
  text-align: left;
  background: color-mix(in srgb, var(--room-accent) 9%, var(--field));
}
.room-unread-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--room-accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--room-accent) 12%, transparent); }
.room-unread-copy { display: grid; min-width: 0; gap: 2px; }
.room-card .room-unread-copy strong { display: block; overflow: hidden; margin: 0; color: var(--text); font-size: .69rem; text-overflow: ellipsis; white-space: nowrap; }
.room-card .room-unread-copy small { display: block; color: var(--muted); font-size: .62rem; }
.room-unread-count { display: grid; min-width: 23px; height: 23px; place-items: center; padding: 0 6px; border-radius: 999px; color: #fff; background: var(--room-accent); font-size: .63rem; font-weight: 900; }

/* Çoklu oda duyuru seçimi */
.announcement-room-selection { margin: 8px 0; padding: 14px; border: 1px solid var(--line); border-radius: 15px; }
.announcement-room-selection legend { padding: 0 7px; color: var(--text); font-size: .78rem; font-weight: 820; }
.announcement-select-all { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; margin-bottom: 12px; padding: 11px 12px; border: 1px solid color-mix(in srgb, var(--accent) 28%, var(--line)); border-radius: 12px; background: var(--accent-soft); cursor: pointer; }
.announcement-select-all input, .announcement-room-option input { width: 18px; height: 18px; min-height: 0; accent-color: var(--accent-strong); }
.announcement-select-all > span:not(.selected-room-count) { display: grid; gap: 2px; }
.announcement-select-all strong { font-size: .78rem; }
.announcement-select-all small { color: var(--muted); font-size: .65rem; }
.selected-room-count { color: var(--accent); font-size: .68rem; font-weight: 800; white-space: nowrap; }
.announcement-room-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 7px; }
.announcement-room-option { display: flex; min-height: 42px; align-items: center; gap: 9px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 11px; background: var(--field); cursor: pointer; transition: border-color .15s, background .15s; }
.announcement-room-option:has(input:checked) { border-color: color-mix(in srgb, var(--accent) 48%, var(--line)); background: var(--accent-soft); }
.announcement-room-option span { overflow: hidden; font-size: .72rem; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }

/* Duyuru yönetimi */
.announcement-message { position: relative; padding-right: 54px; }
.announcement-actions-button { position: absolute; top: 9px; right: 9px; display: grid; width: 32px; height: 32px; place-items: center; padding: 0; border: 1px solid color-mix(in srgb, var(--accent) 22%, var(--line)); border-radius: 10px; color: var(--accent); background: var(--accent-soft); }
.announcement-actions-button:hover { color: #fff; background: var(--accent-strong); }
.announcement-actions-button .ui-icon { width: 18px; height: 18px; }

@media (max-width: 700px) {
  .announcement-room-grid { grid-template-columns: 1fr 1fr; }
  .announcement-select-all { grid-template-columns: auto 1fr; }
  .selected-room-count { grid-column: 2; }
  .room-card-notification { margin-top: 11px; }
}

/* Sohbet alanını gerçek ekranın altına sabitler; composer altında boşluk oluşmasını engeller. */
.app-view.chat-mode {
  position: fixed;
  top: var(--header-height);
  right: 0;
  bottom: 0;
  left: 50%;
  width: min(1120px, 100%);
  min-height: 0;
  padding: 14px;
  overflow: hidden;
  transform: translateX(-50%);
}
.app-view.chat-mode .chat-layout {
  width: 100%;
  height: 100%;
  min-height: 0;
}
.app-view.chat-mode .message-list { min-height: 0; }
.app-view.chat-mode .composer { margin: 0; }

@media (max-width: 700px) {
  .app-view.chat-mode { padding: 6px; }
  .app-view.chat-mode .chat-layout { height: 100%; min-height: 0; }
}

/* Yetkili kullanıcı şifre yenileme */
.admin-password-button { border-color: color-mix(in srgb, var(--accent) 38%, var(--line)); color: var(--accent); }
.admin-password-button:hover { color: #fff; background: var(--accent-strong); }
.password-reset-warning { padding: 11px 12px; border: 1px solid color-mix(in srgb, var(--warning) 30%, var(--line)); border-radius: 12px; color: var(--muted); background: color-mix(in srgb, var(--warning) 7%, transparent); font-size: .74rem; line-height: 1.45; }

/* Bildirimler beklemeden yatay kaydırılarak kapatılabilir. */
.toast { touch-action: pan-y; user-select: none; will-change: transform, opacity; }
.toast.toast-dragging { cursor: grabbing; filter: brightness(1.05); }
.toast.toast-swipe-left { animation: toast-swipe-left .2s ease-in forwards; }
.toast.toast-swipe-right { animation: toast-swipe-right .2s ease-in forwards; }
@keyframes toast-swipe-left { to { opacity: 0; transform: translateX(-120%); } }
@keyframes toast-swipe-right { to { opacity: 0; transform: translateX(120%); } }

/* Asra AI ana kartı */
.asra-ai-card {
  position: relative;
  display: block;
  width: 100%;
  min-height: 210px;
  overflow: hidden;
  margin: 0 0 20px;
  padding: 0;
  border: 1px solid color-mix(in srgb, var(--accent) 32%, var(--line));
  border-radius: 24px;
  text-align: left;
  background: #050607;
  box-shadow: 0 18px 50px rgba(0, 0, 0, .24);
  transition: transform .18s, border-color .18s, box-shadow .18s;
}
.asra-ai-card:hover { border-color: color-mix(in srgb, var(--accent) 70%, var(--line)); transform: translateY(-3px); box-shadow: 0 24px 60px rgba(0, 0, 0, .32); }
.asra-ai-card > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .8; transition: transform .35s, opacity .2s; }
.asra-ai-card:hover > img { opacity: .92; transform: scale(1.02); }
.asra-ai-card-overlay { position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; padding: 24px; background: linear-gradient(90deg, rgba(4, 5, 8, .78), rgba(4, 5, 8, .15) 60%, rgba(4, 5, 8, .55)); }
.asra-ai-card-copy { display: grid; max-width: 530px; gap: 5px; }
.asra-ai-card-copy strong { color: #fff; font-size: clamp(1.55rem, 4vw, 2.2rem); letter-spacing: -.04em; }
.asra-ai-card-copy small { color: rgba(255, 255, 255, .7); font-size: .82rem; }
.asra-ai-badge { width: fit-content; padding: 4px 7px; border: 1px solid rgba(255, 255, 255, .2); border-radius: 999px; color: rgba(255, 255, 255, .78); background: rgba(255, 255, 255, .08); font-size: .58rem; font-weight: 900; letter-spacing: .14em; }
.asra-ai-card-action { display: flex; min-height: 42px; align-items: center; gap: 8px; padding: 0 14px; border: 1px solid rgba(255, 255, 255, .2); border-radius: 13px; color: #fff; background: rgba(9, 12, 18, .72); backdrop-filter: blur(12px); font-size: .75rem; font-weight: 800; white-space: nowrap; }
.asra-ai-card-action .ui-icon { width: 17px; height: 17px; }

/* Asra AI sohbeti */
.ai-chat-layout { display: grid; height: calc(100dvh - var(--header-height) - 50px); min-height: 570px; grid-template-rows: auto auto minmax(0, 1fr) auto; overflow: hidden; border: 1px solid color-mix(in srgb, var(--accent) 22%, var(--line)); border-radius: 25px; background: var(--surface); box-shadow: var(--shadow); }
.ai-chat-hero { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 9%, var(--surface-strong)), var(--surface-strong)); }
.ai-chat-hero > img { width: 52px; height: 30px; flex: 0 0 auto; border: 1px solid var(--line); border-radius: 8px; object-fit: cover; background: #050607; }
.ai-chat-hero > div { min-width: 0; flex: 1; }
.ai-chat-hero .eyebrow { margin: 0 0 1px; font-size: .58rem; letter-spacing: .12em; }
.ai-chat-hero h1 { margin: 0; font-size: .92rem; letter-spacing: -.02em; line-height: 1.2; }
.ai-chat-hero p:not(.eyebrow) { display: none; }
.ai-suggestions { display: flex; gap: 6px; overflow-x: auto; padding: 6px 10px; border-bottom: 1px solid var(--line); scrollbar-width: none; }
.ai-suggestions::-webkit-scrollbar { display: none; }
.ai-suggestion-button { min-height: 34px; flex: 0 0 auto; padding: 0 11px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); background: var(--field); font-size: .68rem; font-weight: 700; }
.ai-suggestion-button:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.ai-message-list { overflow-y: auto; padding: 18px clamp(12px, 3vw, 28px); background: radial-gradient(circle at 10% 10%, color-mix(in srgb, var(--accent) 5%, transparent), transparent 24rem), var(--bg-soft); }
.ai-message-row { display: flex; align-items: flex-end; gap: 8px; margin: 9px 0; }
.ai-message-row.user { flex-direction: row-reverse; }
.ai-message-avatar { display: grid; width: 32px; height: 32px; flex: 0 0 auto; place-items: center; border-radius: 11px; color: #fff; font-size: .66rem; font-weight: 900; }
.ai-message-avatar.assistant { background: linear-gradient(145deg, #7d8cff, #5366e8); }
.ai-message-avatar.user { border-radius: 50%; background: #2d9c6f; }
.ai-message-bubble { width: fit-content; max-width: min(76%, 650px); padding: 10px 12px 8px; border: 1px solid var(--line); border-radius: 7px 17px 17px; background: var(--other-bubble); box-shadow: 0 5px 15px rgba(0, 0, 0, .09); }
.ai-message-row.user .ai-message-bubble { color: #fff; border-color: rgba(255, 255, 255, .08); border-radius: 17px 7px 17px 17px; background: linear-gradient(145deg, #5668e9, #4052ce); }
.ai-message-bubble strong { display: block; margin-bottom: 4px; color: var(--accent); font-size: .68rem; }
.ai-message-row.user .ai-message-bubble strong { color: rgba(255, 255, 255, .76); }
.ai-message-bubble p { margin: 0; overflow-wrap: anywhere; font-size: .86rem; line-height: 1.5; white-space: pre-wrap; }
.ai-message-bubble time { display: block; margin-top: 5px; color: var(--faint); font-size: .58rem; text-align: right; }
.ai-message-row.user .ai-message-bubble time { color: rgba(255, 255, 255, .58); }
.ai-message-meta { display: flex; align-items: center; justify-content: flex-end; gap: 9px; margin-top: 5px; }
.ai-message-meta time { margin-top: 0; }
.ai-sources-toggle { margin: 0; padding: 0; border: 0; color: var(--accent); background: transparent; font-size: .58rem; font-weight: 800; line-height: 1; }
.ai-sources-toggle:hover { text-decoration: underline; }
.ai-sources-list { display: grid; gap: 4px; margin-top: 7px; padding-top: 7px; border-top: 1px solid var(--line); }
.ai-source-link { color: var(--muted); font-size: .62rem; line-height: 1.35; text-decoration: none; overflow-wrap: anywhere; }
.ai-source-link:hover { color: var(--accent); text-decoration: underline; }
.ai-typing { width: fit-content; margin: 7px 40px; padding: 7px 10px; border-radius: 999px; color: var(--muted); background: var(--surface-hover); font-size: .65rem; animation: ai-typing-pulse 1s ease-in-out infinite alternate; }
@keyframes ai-typing-pulse { to { opacity: .5; } }
.ai-composer { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 8px; padding: 11px 13px calc(11px + var(--safe-bottom)); border-top: 1px solid var(--line); background: var(--surface-strong); }
.ai-composer textarea { height: 46px; min-height: 46px; max-height: 110px; padding: 12px 14px; resize: none; }
.ai-send-button { width: 46px; height: 46px; color: #fff; border: 0; background: linear-gradient(145deg, var(--accent), var(--accent-strong)); }

@media (max-width: 700px) {
  .asra-ai-card { min-height: 170px; border-radius: 19px; }
  .asra-ai-card-overlay { padding: 16px; }
  .asra-ai-card-action { min-height: 37px; padding: 0 10px; }
  .asra-ai-card-copy small { max-width: 230px; }
  .ai-chat-layout { height: calc(100dvh - var(--header-height) - 24px); min-height: 480px; border-radius: 18px; }
  .ai-chat-hero { flex-wrap: nowrap; gap: 8px; padding: 7px 10px; }
  .ai-chat-hero > img { width: 42px; height: 24px; border-radius: 7px; }
  .ai-chat-hero h1 { font-size: .84rem; }
  .ai-suggestion-button { min-height: 30px; padding: 0 9px; font-size: .64rem; }
  .ai-message-bubble { max-width: 86%; }
}

/* AI oturumu kapatıldığında geçici konuşma belleği tamamen temizlenir. */
.ai-close-button { min-height: 28px; margin-left: auto; padding: 0 8px; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); background: var(--field); font-size: .62rem; font-weight: 780; white-space: nowrap; flex: 0 0 auto; }
.ai-close-button:hover { border-color: var(--danger); color: var(--danger); background: color-mix(in srgb, var(--danger) 7%, transparent); }
@media (max-width: 700px) {
  .ai-close-button { min-height: 26px; padding: 0 7px; }
}
/* AA Coin, mağaza, görev ve oyun sistemi */
.coin-pill {
  display: inline-flex;
  min-height: 34px;
  align-items: center;
  gap: 7px;
  padding: 0 11px;
  border: 1px solid color-mix(in srgb, var(--warning) 35%, var(--line));
  border-radius: 999px;
  color: var(--warning);
  background: color-mix(in srgb, var(--warning) 9%, var(--surface));
  font-size: .74rem;
  font-weight: 900;
  white-space: nowrap;
}
.coin-pill b { color: var(--text); font-variant-numeric: tabular-nums; }
.shop-grid, .quest-grid, .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.shop-card, .quest-card, .game-card {
  position: relative;
  overflow: hidden;
  padding: 16px;
  border: 1px solid var(--line);

  background: linear-gradient(145deg, var(--surface), color-mix(in srgb, var(--surface-hover) 70%, transparent));

.shop-card h3, .quest-card h3, .game-card h3 { margin: 0 0 7px; font-size: .98rem; }
.shop-card p, .quest-card p, .game-card p { margin: 0 0 13px; color: var(--muted); font-size: .78rem; line-height: 1.45; }
.shop-price { display: inline-flex; align-items: center; gap: 5px; margin-bottom: 12px; color: var(--warning); font-weight: 900; }
.quest-progress { height: 8px; overflow: hidden; border-radius: 999px; background: var(--field); margin: 10px 0 8px; }
.quest-progress span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--accent), var(--success)); }
.quest-meta { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: .7rem; margin-bottom: 12px; }
.game-canvas { width: 100%; max-width: 420px; aspect-ratio: 16 / 10; border: 1px solid var(--line); border-radius: 16px; background: #080a10; }
.game-hud { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 12px 0; color: var(--muted); font-size: .78rem; }
.frame-royal_crown, .frame-bear_guard, .frame-hero_flash, .frame-star_nebula, .frame-dragon_fire, .frame-ice_legend { position: relative; overflow: visible; }
.frame-royal_crown { box-shadow: 0 0 0 3px #f2b84b, 0 0 22px rgba(242, 184, 75, .45); }
.frame-bear_guard { box-shadow: 0 0 0 3px #b27a4b, 0 0 22px rgba(178, 122, 75, .35); }
.frame-hero_flash { box-shadow: 0 0 0 3px #ef6472, 0 0 22px rgba(83, 102, 232, .45); }
.frame-star_nebula { box-shadow: 0 0 0 3px #9b8cff, 0 0 24px rgba(155, 140, 255, .5); }
.frame-dragon_fire { box-shadow: 0 0 0 3px #ff7a3d, 0 0 24px rgba(255, 122, 61, .5); }
.frame-ice_legend { box-shadow: 0 0 0 3px #78d7ff, 0 0 24px rgba(120, 215, 255, .5); }
.frame-royal_crown::after, .frame-bear_guard::after, .frame-hero_flash::after, .frame-star_nebula::after, .frame-dragon_fire::after, .frame-ice_legend::after {
  position: absolute;
  z-index: 3;
  top: -14px;
  right: -8px;
  width: 24px;
  height: 24px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--surface-strong);
  font-size: 14px;
  box-shadow: 0 5px 14px rgba(0,0,0,.25);
}
.profile-avatar.frame-royal_crown::after { top: -18px; right: -10px; width: 32px; height: 32px; font-size: 20px; }
.frame-royal_crown::after { content: "👑"; }
.frame-bear_guard::after { content: "🐻"; }
.frame-hero_flash::after { content: "🦸"; }
.frame-star_nebula::after { content: "✨"; }
.frame-dragon_fire::after { content: "🐉"; }
.frame-ice_legend::after { content: "❄️"; }
@media (max-width: 700px) { .coin-pill span { display: none; } .coin-pill { min-height: 32px; padding: 0 9px; } .shop-grid, .quest-grid, .game-grid { grid-template-columns: 1fr; } }


/* --- Bilgi Odası + formlar + şikayet --- */
.info-cats { display: flex; flex-wrap: wrap; gap: 9px; margin: 4px 0 18px; }
.info-cat { min-height: 42px; padding: 0 16px; border: 1px solid var(--line); border-radius: 12px; color: var(--muted); background: var(--field); font-weight: 750; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.info-cat.active { color: var(--text); border-color: var(--accent); background: var(--accent-soft); }
.info-cat-emoji { font-size: 1.05rem; line-height: 1; }
.badge.rehber { color: var(--warning); background: color-mix(in srgb, var(--warning) 14%, transparent); }
.info-refresh-note, .form-retention-note { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin: -2px 0 14px; padding: 8px 12px; border: 1px dashed color-mix(in srgb, var(--warning) 45%, var(--line)); border-radius: 12px; color: var(--warning); background: color-mix(in srgb, var(--warning) 8%, transparent); font-size: .8rem; line-height: 1.45; }
.info-refresh-note .ui-icon, .form-retention-note .ui-icon { width: 15px; height: 15px; flex: none; }
.form-reply-like { min-height: 26px; padding: 0 9px; font-size: .78rem; }
.form-reply-like.active { color: var(--danger); border-color: var(--danger); background: color-mix(in srgb, var(--danger) 10%, transparent); }
.form-retention-note { margin: 0 0 16px; }
.info-item-list { display: grid; gap: 11px; }
.info-item { padding: 13px; border: 1px solid var(--line); border-radius: 13px; background: var(--field); display: grid; gap: 8px; }
.info-item-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }
.info-item-title { font-size: 1.02rem; }
.info-item-meta { display: flex; align-items: center; gap: 9px; color: var(--faint); font-size: .72rem; }
.info-item-body { color: var(--text); font-size: .9rem; line-height: 1.55; }
.info-item-toggle { align-self: start; font-size: .8rem; padding: 3px 10px; min-height: 26px; }
.info-item-link { align-self: start; font-size: .8rem; min-height: 30px; text-decoration: none; }
.info-forms-toolbar { display: flex; flex-direction: column; gap: 10px; margin: 2px 0 14px; }
.info-form-create, .admin-add-form { border: 1px dashed var(--line); border-radius: 13px; padding: 12px; }
.info-form-list { display: grid; gap: 13px; }
.form-card { border: 1px solid var(--line); border-radius: 14px; background: var(--field); padding: 13px; display: grid; gap: 9px; }
.form-card-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }
.form-title { font-size: 1.03rem; }
.form-card-meta, .form-reply-head { display: flex; align-items: center; gap: 10px; color: var(--faint); font-size: .7rem; flex-wrap: wrap; }
.form-card-actions { display: flex; gap: 8px; }
.form-like-btn.active { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.form-card-meta button, .form-reply-head button { min-height: 24px; padding: 0 8px; font-size: .78rem; }
.form-body { color: var(--text); font-size: .92rem; line-height: 1.55; white-space: pre-wrap; margin: 0; }
.form-replies { display: grid; gap: 7px; padding-left: 4px; }
.form-reply { border-left: 2px solid var(--line); padding: 5px 10px; background: var(--bg); border-radius: 0 9px 9px 0; }
.form-reply p { margin: 3px 0 0; font-size: .87rem; line-height: 1.45; }
.form-reply-composer { display: flex; gap: 7px; }
.form-reply-input { flex: 1; min-width: 0; }
.form-reply-composer .primary-button { min-height: 40px; padding: 0 14px; }
.form-delete-btn, .form-report-btn { font-weight: 700; }
.admin-items-box, .admin-feed-box { margin-bottom: 16px; }
.admin-items-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.admin-items-head h3 { margin: 0; }
.admin-feed-box textarea { width: 100%; }
.switch-row { display: flex; align-items: center; gap: 8px; margin: 8px 0; color: var(--muted); font-size: .86rem; }
.admin-item-row { display: flex; align-items: center; gap: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); }
.admin-item-copy { flex: 1; min-width: 0; display: grid; gap: 3px; }
.admin-item-copy small { color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.admin-complaint-list { display: grid; gap: 12px; }
.complaint-row { border: 1px solid var(--line); border-radius: 14px; background: var(--field); padding: 13px; display: grid; gap: 9px; }
.complaint-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.complaint-person { display: inline-flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.complaint-label { color: var(--muted); font-size: .74rem; font-weight: 750; }
.complaint-head time { color: var(--faint); font-size: .7rem; margin-left: auto; }
.complaint-reason { display: grid; gap: 4px; }
.complaint-reason p { margin: 0; background: var(--bg); border-radius: 10px; padding: 9px 11px; font-size: .88rem; line-height: 1.5; }
.complaint-context { color: var(--faint); font-size: .78rem; line-height: 1.5; margin: 0; }
.complaint-row .admin-user-actions { display: flex; flex-wrap: wrap; gap: 7px; }
.message-report-btn { background: none; border: 0; cursor: pointer; padding: 1px 3px; font-size: .92rem; line-height: 1; opacity: .62; filter: grayscale(1); transition: opacity .15s ease; }
.message-report-btn:hover, .message-report-btn:focus-visible { opacity: 1; }
.report-quota { color: var(--accent); font-weight: 750; }

<body>
  <div id="loading-overlay" class="loading-overlay" role="status" aria-live="polite" hidden>
    <img class="loading-logo" data-logo alt="">
    <strong id="loading-title">Yükleniyor</strong>
    <span id="loading-subtitle">Kontrol ediliyor, güvenlik bakılıyor</span>
    <span class="loading-dots" aria-hidden="true"><i></i><i></i><i></i></span>
  </div>

  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>

  <main id="auth-screen" class="auth-screen">
    <section class="auth-card" aria-labelledby="auth-title">
      <div class="brand-lockup">
        <div class="auth-logo-wrap"><img class="auth-logo" data-logo alt="Asra"></div>
        <div>
          <p class="eyebrow" data-i18n="authEyebrow">TOPLULUK MESAJLAŞMASI</p>
          <h1 id="auth-title">Asra Chat</h1>
          <p id="auth-description" class="muted" data-i18n="authDescription">Topluluğa katılmak için hesap oluşturun veya giriş yapın.</p>
        </div>
      </div>


      <section id="auth-options" class="auth-options" aria-label="Hesap işlemleri" data-i18n-aria="authActionsAria">
        <div class="segmented-control" role="tablist" aria-label="Giriş veya kayıt" data-i18n-aria="authTabsAria">
          <button id="login-tab" class="segment active" type="button" role="tab" aria-selected="true" data-i18n="tabLogin">Giriş Yap</button>
          <button id="register-tab" class="segment" type="button" role="tab" aria-selected="false" data-i18n="tabRegister">Kaydol</button>
        </div>

        <form id="login-form" class="auth-form" autocomplete="on">
          <label for="login-username" data-i18n="username">Kullanıcı adı</label>
          <input id="login-username" name="username" type="text" minlength="3" maxlength="24" required autocomplete="username">
          <label for="login-password" data-i18n="password">Şifre</label>
          <div class="password-field">
            <input id="login-password" name="password" type="password" maxlength="128" required autocomplete="current-password">
            <button class="icon-text-button password-toggle" type="button" aria-label="Şifreyi göster" data-i18n-aria="showPasswordAria" data-i18n="show">Göster</button>
          </div>
          <button class="primary-button full" type="submit" data-i18n="tabLogin">Giriş Yap</button>
        </form>

        <form id="register-form" class="auth-form" autocomplete="on" hidden>
          <label for="register-username" data-i18n="username">Kullanıcı adı</label>
          <input id="register-username" name="username" type="text" minlength="3" maxlength="24" pattern="[A-Za-zÀ-ž0-9_]+" required autocomplete="username" aria-describedby="username-rules">
          <p id="username-rules" class="field-note" data-i18n="usernameRules">3–24 karakter; yalnızca harf, rakam ve alt çizgi.</p>
          <label for="register-password" data-i18n="password">Şifre</label>
          <div class="password-field">
            <input id="register-password" name="password" type="password" minlength="10" maxlength="128" required autocomplete="new-password">
            <button class="icon-text-button password-toggle" type="button" aria-label="Şifreyi göster" data-i18n-aria="showPasswordAria" data-i18n="show">Göster</button>
          </div>
          <label for="register-password-confirm" data-i18n="passwordConfirm">Şifre tekrarı</label>
          <input id="register-password-confirm" name="password_confirm" type="password" minlength="10" maxlength="128" required autocomplete="new-password">
          <p class="field-note" data-i18n="passwordRules">En az 10 karakter; harf, rakam ve özel karakter içermelidir.</p>
          <button class="primary-button full" type="submit" data-i18n="registerSubmit">Hesap Oluştur</button>
        </form>
      </section>
    </section>
  </main>

  <div id="status-screen" class="status-screen" hidden></div>

  <div id="app-shell" class="app-shell" hidden>
    <header class="app-header">
      <button id="back-button" class="round-button" type="button" aria-label="Geri" data-no-action-lock hidden>
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <button id="brand-button" class="header-brand" type="button" aria-label="Ana sayfa" data-no-action-lock>
        <img data-logo alt="">
        <span><strong id="header-title">Asra Chat</strong><small id="header-subtitle">Topluluk</small></span>
      </button>
      <div class="header-actions">
        <button id="coin-pill" class="coin-pill" type="button" title="AA Coin bakiyesi" data-i18n-title="coinTitle"><span>AA Coin</span><b id="coin-balance">0</b></button>
        <span id="connection-state" class="connection-state" title="Bağlantı durumu" data-i18n-title="connTitle"><i></i><span>Bağlı</span></span>
        <button id="menu-button" class="round-button" type="button" aria-label="Menüyü aç" aria-expanded="false" data-i18n-aria="menuOpenAria">
          <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
        </button>
      </div>
      <nav id="account-menu" class="account-menu" hidden aria-label="Hesap menüsü" data-i18n-aria="menuAria">
        <button type="button" data-menu-action="profile"><span>◎</span> <span data-i18n="profile">Profilim</span></button>
        <button type="button" data-menu-action="shop"><span>◈</span> <span data-i18n="menuShop">Mağaza</span></button>
        <button type="button" data-menu-action="quests"><span>✦</span> <span data-i18n="menuQuests">Görevler ve Oyunlar</span></button>
        <button type="button" data-menu-action="settings"><span>⚙</span> <span data-i18n="settings">Ayarlar</span></button>
        <button type="button" data-menu-action="admin"><span>◇</span> <span data-i18n="admin">Admin Paneli</span></button>
        <button type="button" data-menu-action="refresh"><span>⟳</span> <span data-i18n="menuRefresh">Yenile</span></button>
        <hr>
        <button class="danger-text" type="button" data-menu-action="logout"><span>↪</span> <span data-i18n="logout">Çıkış Yap</span></button>
      </nav>
    </header>

    <main id="app-view" class="app-view" tabindex="-1"></main>
  </div>

  <div id="modal-backdrop" class="modal-backdrop" hidden>
    <section id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header class="modal-header">
        <div>
          <p id="modal-kicker" class="eyebrow"></p>
          <h2 id="modal-title">Bilgi</h2>
        </div>
        <button id="modal-close" class="round-button" type="button" aria-label="Pencereyi kapat">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </header>
      <div id="modal-content" class="modal-content"></div>
    </section>
  </div>

const $ = (selector, root = document) => root.querySelector(selector);
const $$ = (selector, root = document) => Array.from(root.querySelectorAll(selector));

// işçisi, Notification API) kullanılmaz; kimlik başlığı köprüden alınır.
const isNativeApp = () => !!(window.AsraNative && typeof window.AsraNative.isNativeApp === 'function' && window.AsraNative.isNativeApp());

/**
 * Gecerli arayuz dili. Desteklenmeyen bir dil kaydiyla gelen kullanici
 * (eskiden de/fr secmis olabilir) sessizce 'tr'ye duser.
 */
function currentLanguage() {
  const fromUser = state.user?.language;
  if (SUPPORTED_LANGUAGES.includes(fromUser)) return fromUser;
  // Giris ekrani ve cikis sonrasi: kullanici henuz yok, bu yüzden son secim
  // hatirlanir (tema da ayni deseni kullanir). Boylece Ingilizce secmis bir
  // kullanici cikis yaptiginda giris ekrani Turkce'ye donmez.
  try {
    const remembered = localStorage.getItem('asra_language');
    if (SUPPORTED_LANGUAGES.includes(remembered)) return remembered;
  } catch (_) { /* Storage kapali olabilir. */ }
  return 'tr';
}

/** Son dil secimini hatirlar; depolama kapaliysa sessizce yutar. */
function rememberLanguage(code) {
  if (!SUPPORTED_LANGUAGES.includes(code)) return;
  try { localStorage.setItem('asra_language', code); } catch (_) { /* yok say */ }
}

/**
 * Sunucudan gelen insan dilini secili dile cevirir. Turkce arayuzde metne
 * HIC dokunmaz (sunucunun kendi cumlesi birebir korunur); baska bir dilde
 * eslesme varsa cevirisi, yoksa sunucunun cumlesi gosterilir.
 */
function localizeServerMessage(text) {
  const value = String(text ?? '');
  if (currentLanguage() === 'tr') return value;
  const key = SERVER_MESSAGE_I18N[value.trim()];
  return key ? t(key) : value;
}

function t(key, params) {
  // Anahtar hicbir yerde yoksa gorunurluk icin anahtarin kendisi doner.
  const language = currentLanguage();
  let text = I18N[language]?.[key] ?? I18N.tr[key] ?? key;
  if (params) {
    for (const [name, value] of Object.entries(params)) {
      text = text.split('{' + name + '}').join(String(value));
    }
  }
  return text;
}

function repairLegacyTurkishText(value) {
  let text = String(value ?? '');
  const replacements = [
    ['Ho? geldin', 'Hoş geldin'], ['Ho? ', 'Hoş '],
    ['Astrofoto?raf', 'Astrofotoğraf'], ['astrofoto?raf', 'astrofotoğraf'],
    ['Foto?rafçılık', 'Fotoğrafçılık'], ['foto?rafçılık', 'fotoğrafçılık'],
    ['Foto?raf', 'Fotoğraf'], ['foto?raf', 'fotoğraf'],
    ['G?ky?z?', 'Gökyüzü'], ['g?ky?z?', 'gökyüzü'],
    ['İ?leme', 'İşleme'], ['i?leme', 'işleme'],
    ['I?ık', 'Işık'], ['ı?ık', 'ışık'],
    ['Ba?arılı', 'Başarılı'], ['ba?arılı', 'başarılı'],
    ['G?zel', 'Güzel'], ['g?zel', 'güzel'],
    ['ÄŸ', 'ğ'], ['Äž', 'Ğ'], ['ÅŸ', 'ş'], ['Åž', 'Ş'],
    ['Ä±', 'ı'], ['Ä°', 'İ'], ['Ã¶', 'ö'], ['Ã–', 'Ö'],
    ['Ã¼', 'ü'], ['Ãœ', 'Ü'], ['Ã§', 'ç'], ['Ã‡', 'Ç']
  ];
  replacements.forEach(([broken, corrected]) => { text = text.split(broken).join(corrected); });
  text = text.replace(/\uFFFD+/g, '…');
  return text;
}

function createElement(tag, className = '', text = '') {
  const element = document.createElement(tag);
  if (className) element.className = className;
  if (text !== '') element.textContent = text;
  return element;
}
