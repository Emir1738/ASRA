function button(text, className = 'secondary-button', type = 'button') {
  const element = createElement('button', className, text);
  element.type = type;
  return element;
}

/**
 * Bir düğmeye arka arkaya basılması sunucuya aynı isteği tekrar tekrar
 * göndermesin diye işlem bitene kadar düğmeyi kilitler.
 */
function guardedAction(element, handler) {
  let running = false;
  element.addEventListener('click', async (event) => {
    if (running) return;
    running = true;
    element.disabled = true;
    try {
      await handler(event);
    } finally {
      running = false;
      if (element.isConnected) element.disabled = false;
    }
  });
  return element;
}

function applyTheme(theme) {
  const safeTheme = theme === 'light' ? 'light' : 'dark';
  document.documentElement.dataset.theme = safeTheme;
  document.querySelector('meta[name="theme-color"]')?.setAttribute('content', safeTheme === 'light' ? '#f2f4f9' : '#090b10');
  try { localStorage.setItem('asra_theme', safeTheme); } catch (_) { /* Storage kapalı olabilir. */ }
}

/**
 * Secili dili UYGULAR. Onceden yalnizca <html lang> ve baglanti etiketini
 * yaziyordu; statik HTML (giris/kayit, baslik, menu) ve acik ekran Turkce
 * kaliyordu. Artik data-i18n / -ph / -aria / -title nitelikli her ogeyi ve
 * baglanti durumunu tazeler. Cagiran taraf (ayarlar kaydi) zaten mevcut
 * ekrani yeniden cizdigi icin acik gorunum de aninda dile doner.
 */
function applyLanguage() {
  const language = currentLanguage();
  document.documentElement.lang = language;
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach((el) => { el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll('[data-i18n-aria]').forEach((el) => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
  document.querySelectorAll('[data-i18n-title]').forEach((el) => { el.title = t(el.dataset.i18nTitle); });
  const conn = $('#connection-state span');
  if (conn) conn.textContent = state.connected ? t('connected') : t('offline');
}

function setLoading(visible, title = t('loading'), subtitle = t('checking')) {
  if (visible) state.loadingCount += 1;
  else state.loadingCount = Math.max(0, state.loadingCount - 1);
  $('#loading-title').textContent = title;
  $('#loading-subtitle').textContent = subtitle;
  $('#loading-overlay').hidden = state.loadingCount === 0;
}

function makeToastDismissible(item) {
  let startX = 0;
  let pointerId = null;
  item.addEventListener('pointerdown', (event) => {
    if (event.button !== undefined && event.button !== 0) return;
    startX = event.clientX;
    pointerId = event.pointerId;
    item.classList.add('toast-dragging');
    if (item.setPointerCapture) item.setPointerCapture(pointerId);
  });
  const finish = (event) => {
    if (pointerId === null || event.pointerId !== pointerId) return;
    const distance = event.clientX - startX;
    item.classList.remove('toast-dragging');
    pointerId = null;
    if (Math.abs(distance) < 45) return;
    item.classList.add(distance < 0 ? 'toast-swipe-left' : 'toast-swipe-right');
    window.setTimeout(() => item.remove(), 220);
  };
  item.addEventListener('pointerup', finish);
  item.addEventListener('pointercancel', () => {
    pointerId = null;
    item.classList.remove('toast-dragging');
  });
}

function toast(message, type = 'success', duration = 4200) {
  const item = createElement('div', `toast ${type}`.trim());
  item.setAttribute('role', type === 'error' ? 'alert' : 'status');
  item.append(createElement('span', '', String(message)));
  makeToastDismissible(item);
  $('#toast-region').append(item);
  window.setTimeout(() => item.remove(), duration);
}

function setConnection(connected) {
  state.connected = connected;
  const indicator = $('#connection-state');
  indicator.classList.toggle('offline', !connected);
  $('span', indicator).textContent = connected ? t('connected') : t('offline');
}

function formatCoin(value) {
  return new Intl.NumberFormat(currentLanguage(), { minimumFractionDigits: 0, maximumFractionDigits: 1 }).format(Number(value) || 0);
}

function updateCoinHeader(value = state.user?.aa_coins || 0) {
  const balance = $('#coin-balance');
  if (balance) balance.textContent = formatCoin(value);
}

function mergeUserFromPayload(user) {
  if (!user) return;
  if (user.approval_decision_notice === 'accepted') {
    const acceptKey = `accepted-notice:${user.id}:${user.approval_decision_at || '1'}`;
    let acceptSeen = false;
    try { acceptSeen = localStorage.getItem(acceptKey) === '1'; } catch (_) { acceptSeen = false; }
    if (!acceptSeen) {
      toast('Kabul edildin.', 'success', 7000);
      try { localStorage.setItem(acceptKey, '1'); } catch (_) { /* Storage kapalı olabilir. */ }
    }
    user.approval_decision_notice = null;
  }
  state.user = { ...state.user, ...user };
  updateCoinHeader(state.user.aa_coins);
  if (Number(state.user.aa_coins) < 0 && user.coin_debt_notice_at) {
    const debtKey = `coin-debt-notice:${state.user.id}:${user.coin_debt_notice_at}`;
    let debtSeen = false;
    try { debtSeen = localStorage.getItem(debtKey) === '1'; } catch (_) { debtSeen = false; }
    if (!debtSeen) {
      const due = user.coin_debt_due_at ? ` ${t('coinDebtDue', { when: formatDateTime(user.coin_debt_due_at) })}` : '';
      toast(`${t('coinDebtToast')}${due}`, 'warning', 12000);
      try { localStorage.setItem(debtKey, '1'); } catch (_) { /* Storage kapalı olabilir. */ }
    }
  }
}

async function refreshEconomy(showLoader = false) {
  if (!state.user) return null;
  const payload = await api('get_economy', { loading: showLoader });
  state.economy = payload;
  mergeUserFromPayload(payload.user);
  if (payload.wallet) updateCoinHeader(payload.wallet.aa_coins);
  return payload;
}

class ApiRequestError extends Error {
  constructor(status, code, message, details = {}) {
    super(message);
    this.name = 'ApiRequestError';
    this.status = status;
    this.code = code;
    this.details = details;
  }
}

const inFlightRequests = new Map();

function requestSignature(action, options) {
  return `${action}|${JSON.stringify(options.query || {})}`;
}

const wait = (ms) => new Promise((resolve) => window.setTimeout(resolve, ms));

function retryAfterMilliseconds(response, details = {}) {
  const detailSeconds = Number(details.retry_after || 0);
  const headerValue = response?.headers?.get?.('Retry-After') || '';
  const headerSeconds = /^\d+$/.test(headerValue) ? Number(headerValue) : 0;
  const headerDate = headerSeconds === 0 && headerValue ? Date.parse(headerValue) : NaN;
  const dateSeconds = Number.isFinite(headerDate) ? Math.max(0, Math.ceil((headerDate - Date.now()) / 1000)) : 0;
  return Math.max(0, detailSeconds, headerSeconds, dateSeconds) * 1000;
}

function activateRequestCooldown(response, error) {
  state.serviceErrorCount = Math.min(8, state.serviceErrorCount + 1);
  const serverDelay = retryAfterMilliseconds(response, error.details);
  const exponentialDelay = Math.min(MAX_POLL_BACKOFF_MS, 3000 * (2 ** (state.serviceErrorCount - 1)));
  const delay = Math.max(3000, serverDelay, exponentialDelay);
  state.requestCooldownUntil = Math.max(state.requestCooldownUntil, Date.now() + delay);
  return delay;
}

function clearRequestCooldown() {
  state.serviceErrorCount = 0;
  state.requestCooldownUntil = 0;
}

const pollingTabId = (() => {
  try { return crypto.randomUUID(); } catch (_) { return `${Date.now()}-${Math.random().toString(36).slice(2)}`; }
})();
const fallbackBackgroundRequests = [];

function ownsBackgroundPollingLease() {
  if (document.visibilityState !== 'visible') return false;
  const key = 'asra_polling_leader_v1';
  const now = Date.now();
  try {
    const current = JSON.parse(localStorage.getItem(key) || 'null');
    if (current?.id && current.id !== pollingTabId && Number(current.expires) > now) return false;
    const lease = { id: pollingTabId, expires: now + POLLING_LEASE_MS };
    localStorage.setItem(key, JSON.stringify(lease));
    const confirmed = JSON.parse(localStorage.getItem(key) || 'null');
    return confirmed?.id === pollingTabId;
  } catch (_) {
    return true;
  }
}

function releaseBackgroundPollingLease() {
  try {
    const key = 'asra_polling_leader_v1';
    const current = JSON.parse(localStorage.getItem(key) || 'null');
    if (current?.id === pollingTabId) localStorage.removeItem(key);
  } catch (_) {}
}

function consumeBackgroundRequestBudget() {
  const key = 'asra_background_budget_v1';
  const now = Date.now();
  try {
    const current = JSON.parse(localStorage.getItem(key) || 'null');
    const fresh = current && Number(current.started) > now - BACKGROUND_BUDGET_WINDOW_MS
      ? current
      : { started: now, count: 0 };
    if (Number(fresh.count) >= BACKGROUND_BUDGET_MAX_REQUESTS) return false;
    fresh.count = Number(fresh.count) + 1;
    localStorage.setItem(key, JSON.stringify(fresh));
    return true;
  } catch (_) {
    while (fallbackBackgroundRequests.length && fallbackBackgroundRequests[0] <= now - BACKGROUND_BUDGET_WINDOW_MS) {
      fallbackBackgroundRequests.shift();
    }
    if (fallbackBackgroundRequests.length >= BACKGROUND_BUDGET_MAX_REQUESTS) return false;
    fallbackBackgroundRequests.push(now);
    return true;
  }
}

/**
 * Aynı okuma isteği arka arkaya tetiklendiğinde (hızlı aç-kapa, çift tıklama,
 * üst üste binen yoklamalar) sunucuya tek istek gider; diğerleri aynı yanıtı
 * paylaşır. Sunucu yükü ve "işlem tamamlanamadı" hataları böylece azalır.
 */
async function api(action, options = {}) {
  const method = options.method || 'GET';
  if (method === 'GET' && !options.noDedupe) {
    const signature = requestSignature(action, options);
    const pending = inFlightRequests.get(signature);
    if (pending) return pending;
    const request = performApiRequest(action, options).finally(() => inFlightRequests.delete(signature));
    inFlightRequests.set(signature, request);
    return request;
  }
  return performApiRequest(action, options);
}

async function performApiRequest(action, options = {}) {
  const method = options.method || 'GET';
  const loadingStartedAt = performance.now();
  const cooldownRemaining = Math.max(0, state.requestCooldownUntil - Date.now());
  if (cooldownRemaining > 0) {
    if (options.background) {
      throw new ApiRequestError(429, 'REQUEST_COOLDOWN', t('errThrottleShort'), {
        retry_after: Math.ceil(cooldownRemaining / 1000)
      });
    }
    // priority: kullanıcının ELLE bastığı yenileme. Arka plan yoklamalarının
    // biriktirdiği bekleme kilidi (ağ aksaması/hit limiti sonrası 3-15 sn)
    // moderatörün tıklamasını sessizce yutuyordu — "düğmeye bastım, bekleyenler
    // çıkmadı" şikâyetinin istemci tarafındaki kök nedeni budur. Elle istek
    // bekletilmez; sunucu kendi hız sınırını uygular, sonuç da olduğu gibi
    // gösterilir (SERVICE_BUSY ise aşağıdaki yeniden deneme devreye girer).
    if (!options.priority) await wait(Math.min(cooldownRemaining, 15000));
  }
  if (options.background && !ownsBackgroundPollingLease()) {
    throw new ApiRequestError(429, 'POLLING_FOLLOWER', t('errLeader'), {
      retry_after: Math.ceil(POLLING_LEASE_MS / 1000)
    });
  }
  if (options.background && !consumeBackgroundRequestBudget()) {
    state.requestCooldownUntil = Math.max(state.requestCooldownUntil, Date.now() + BACKGROUND_BUDGET_WINDOW_MS);
    throw new ApiRequestError(429, 'REQUEST_COOLDOWN', t('errBudget'), {
      retry_after: Math.ceil(BACKGROUND_BUDGET_WINDOW_MS / 1000)
    });
  }
  const url = new URL(API_URL, window.location.href);
  url.searchParams.set('action', action);
  Object.entries(options.query || {}).forEach(([key, value]) => url.searchParams.set(key, String(value)));
  const headers = { Accept: 'application/json' };
  if (window.AsraNative && typeof AsraNative.getDeviceId === 'function') {
    try { headers['X-Asra-Device-Id'] = AsraNative.getDeviceId(); } catch (_) {}
  }
  const controller = new AbortController();
  const timeoutMs = Math.max(5000, Number(options.timeoutMs) || (options.formData ? 60000 : (options.background ? 12000 : 25000)));
  const requestTimeout = window.setTimeout(() => controller.abort(), timeoutMs);
  const init = { method, headers, credentials: 'same-origin', signal: controller.signal };
  if (method === 'POST') {
    headers['X-CSRF-Token'] = state.csrf;
    if (options.formData instanceof FormData) {
      init.body = options.formData;
    } else {
      headers['Content-Type'] = 'application/json';
      init.body = JSON.stringify(options.data || {});
    }
  }
  if (options.loading) setLoading(true, options.loadingTitle || t('loading'), options.loadingSubtitle || t('checking'));
  try {
    const response = await fetch(url, init);
    const responseText = await response.text();
    let payload = null;
    try { payload = responseText ? JSON.parse(responseText) : null; } catch (_) { payload = null; }
    // Hosting koruma sayfaları çoğunlukla JSON yerine HTML ve 429/503/508/509 döndürür.
    const isHtmlResponse = responseText && !payload && responseText.trimStart().startsWith('<');
    const isHostLimitStatus = [429, 503, 508, 509].includes(response.status);
    if (!response.ok || !payload?.ok) {
      const error = payload?.error || {};
      // Öncelik: HTML ise mutlaka retry, yoksa normal hata
      let fallbackCode = error.code || 'REQUEST_FAILED';
      let fallbackMessage = error.message || t('errFailed');
      if (responseText && !payload) {
        if (isHtmlResponse && isHostLimitStatus) {
          fallbackCode = 'HOST_LIMIT_REACHED';
          fallbackMessage = t('errThrottleHttp', { status: response.status });
        } else if (isHtmlResponse) {
          // API JSON yerine HTML döndürdü: dosya eksik/yanlış klasörde (404),
          // PHP çalışmıyor (500) ya da sağlayıcı kendi sayfasını gösteriyor.
          // Durum kodu mesajda gösterilir; kesin teşhis için:
          // /auth.php?action=health
          fallbackCode = 'SERVICE_BUSY';
          fallbackMessage = `${t('errHtml', { status: response.status })} ${t('errHtmlHint')} ${t('errDiag')}`;
        } else {
          fallbackMessage = t('errNotJson', { action, status: response.status });
        }
      }
      if (isHostLimitStatus && !['RATE_LIMITED', 'SERVICE_BUSY', 'HOST_LIMIT_REACHED'].includes(fallbackCode)) {
        fallbackCode = 'HOST_LIMIT_REACHED';
        fallbackMessage = t('errThrottle');
      }
      const requestError = new ApiRequestError(response.status || 503, fallbackCode, fallbackMessage, error.details || {});
      if (requestError.details.csrf_token) state.csrf = requestError.details.csrf_token;
      const protectionError = isHostLimitStatus || ['RATE_LIMITED', 'SERVICE_BUSY', 'HOST_LIMIT_REACHED'].includes(requestError.code);
      if (protectionError) {
        activateRequestCooldown(response, requestError);
        setConnection(false);
      }
      if (requestError.code === 'ACCOUNT_BANNED') showBannedStatus(requestError.details.ban || {});
      if (requestError.code === 'ACCOUNT_DELETED') showDeletedStatus(requestError.details || {});
      if (requestError.code === 'AUTH_REQUIRED' && state.user) recoverAuthentication();
      if (requestError.code === 'SESSION_REVOKED') showSessionRevokedStatus();
      // Etkileşimli isteklerde yalnızca bir kontrollü tekrar yapılır. Arka plan
      // yoklamaları tekrar göndermeyerek hit/CPU korumasının büyümesini engeller.
      if (requestError.code === 'SERVICE_BUSY' && !options.background && !options.retriedWhileBusy) {
        const delay = Math.max(3000, state.requestCooldownUntil - Date.now());
        await wait(Math.min(delay, 15000));
        return api(action, { ...options, retriedWhileBusy: true, noDedupe: true });
      }
      if (fallbackCode === 'REQUEST_FAILED' && isHtmlResponse && !options.background && !options.retriedWhileBusy) {
        await wait(3000);
        return api(action, { ...options, retriedWhileBusy: true, noDedupe: true });
      }
      if (requestError.code === 'CSRF_FAILED' && !options.retriedAfterTokenRefresh) {
        const freshToken = requestError.details.csrf_token || (await api('session').catch(() => null))?.csrf_token;
        if (freshToken) {
          state.csrf = freshToken;
          return api(action, { ...options, retriedAfterTokenRefresh: true, noDedupe: true });
        }
      }
      // Arka plan yoklamaları için gereksiz toast'ı engelle: polling hataları sessiz kalır
      if (['get_rooms','get_messages','get_message_views'].includes(action) && !options.loading) {
        // Sessiz hata, üst katman backoff ile yönetir
        throw requestError;
      }
      throw requestError;
    }
    setConnection(true);
    clearRequestCooldown();
    return payload;
  } catch (error) {
    if (error instanceof ApiRequestError) throw error;
    setConnection(false);
    state.serviceErrorCount = Math.min(8, state.serviceErrorCount + 1);
    state.requestCooldownUntil = Math.max(state.requestCooldownUntil, Date.now() + Math.min(MAX_POLL_BACKOFF_MS, 3000 * (2 ** state.serviceErrorCount)));
    if (error?.name === 'AbortError') {
      throw new ApiRequestError(0, 'REQUEST_TIMEOUT', t('errTimeout'), {
        retry_after: Math.ceil(Math.min(MAX_POLL_BACKOFF_MS, 3000 * (2 ** state.serviceErrorCount)) / 1000)
      });
    }
    // Yalnızca güvenli GET istekleri bir kez tekrarlanır. POST işlemlerini tekrar
    // göndermemek çift mesaj, çift satın alma ve gereksiz hit oluşmasını önler.
    if (method === 'GET' && !options.background && !options.retriedWhileBusy) {
      await wait(1200);
      try {
        return await api(action, { ...options, retriedWhileBusy: true, noDedupe: true });
      } catch (_) {}
    }
    throw new ApiRequestError(0, 'NETWORK_ERROR', t('errNetwork'));
  } finally {
    window.clearTimeout(requestTimeout);
    if (options.loading) {
      const minimumDuration = Math.max(0, Number(options.minLoadingMs) || 0);
      const remaining = minimumDuration - (performance.now() - loadingStartedAt);
      if (remaining > 0) await new Promise((resolve) => window.setTimeout(resolve, remaining));
      setLoading(false);
    }
  }
}

let authRecoveryActive = false;
let authRecoveryTimer = null;

/**
 * Oturum kimliği yenilendiği anda yolda olan bir istek 401 dönebilir.
 * Kullanıcı hemen dışarı atılmaz; oturum durumu sunucudan bir kez doğrulanır
 * ve gerçekten kapanmışsa giriş ekranına dönülür.
 */
function recoverAuthentication() {
  if (authRecoveryActive || authRecoveryTimer) return;
  authRecoveryActive = true;
  api('session')
    .then((payload) => {
      if (payload?.csrf_token) state.csrf = payload.csrf_token;
      if (typeof payload?.hit_economy === 'boolean') state.hitEconomy = payload.hit_economy;
      applyRetentionHours(payload?.message_retention_hours);
      if (payload?.authenticated) {
        setConnection(true);
        return;
      }
      if (payload?.approval_required) {
        mergeUserFromPayload(payload.user);
        openApprovalFlow(payload.approval || { submitted: false });
        return;
      }
      // Sunucu oturumun gerçekten kapandığını doğruladı. Cihaza bağlı mevcut
      // hesap doğrudan giriş ekranına geçirilir.
      state.deviceBound = Boolean(payload?.device_has_account);
      state.boundUsername = payload?.bound_username || '';
      showAuth();
    })
    .catch((error) => {
      // Ağ, hosting limiti veya geçici DB hatası kullanıcıyı hesabından atmaz.
      // Oturum ekranda korunur ve sessizce yeniden doğrulanır.
      setConnection(false);
      const retrySeconds = Math.max(5, Math.min(60, Number(error?.details?.retry_after) || 8));
      authRecoveryTimer = window.setTimeout(() => {
        authRecoveryTimer = null;
        recoverAuthentication();
      }, retrySeconds * 1000);
    })
    .finally(() => { authRecoveryActive = false; });
}

function displayError(error) {
  const code = String(error?.code || 'UNKNOWN_ERROR');
  const message = localizeServerMessage(error instanceof Error ? error.message : String(error));
  const now = Date.now();
  const recoverable = [
    'NETWORK_ERROR', 'REQUEST_TIMEOUT', 'SERVICE_BUSY', 'HOST_LIMIT_REACHED',
    'RATE_LIMITED', 'REQUEST_COOLDOWN', 'REQUEST_FAILED', 'POLLING_FOLLOWER'
  ].includes(code);

  if (code === 'POLLING_FOLLOWER') return;
  if (recoverable) {
    setConnection(false);
    if (now - state.lastRecoveryNoticeAt < 30000) return;
    state.lastRecoveryNoticeAt = now;
    toast(t('errSlow'), 'warning', 6000);
    return;
  }

  const reference = error?.details?.reference ? t('errRefSuffix', { ref: error.details.reference }) : '';
  const safeMessage = code === 'INTERNAL_ERROR'
    ? `${t('errInternal')}${reference}`
    : message;
  const key = `${code}|${safeMessage}`;
  if (state.lastErrorToastKey === key && now - state.lastErrorToastAt < 5000) return;
  state.lastErrorToastKey = key;
  state.lastErrorToastAt = now;
  toast(safeMessage, 'error', 6000);
}

function avatarClass(color) {
  const colors = ['#5b6cf9', '#7c4dff', '#009688', '#e85d75', '#f08c46', '#2e86de', '#8e5cba', '#2d9c6f'];
  const index = colors.indexOf(String(color || '').toLowerCase());
  return `avatar-c${index >= 0 ? index + 1 : 1}`;
}

function initialOf(username) {
  return Array.from(String(username || '?').trim())[0]?.toLocaleUpperCase(currentLanguage()) || '?';
}

function isSafeImagePath(path) {
  const value = String(path || '');
  return /^uploads\/[a-f0-9]{32}\.(jpg|png|gif|webp)$/.test(value) || /^media:\d+:[a-f0-9]{32}$/.test(value);
}

function imageSource(path) {
  const value = String(path || '');
  const match = value.match(/^media:(\d+):([a-f0-9]{32})$/);
  if (match) {
    return `${API_URL}?action=get_media&id=${encodeURIComponent(match[1])}&token=${encodeURIComponent(match[2])}`;
  }
  return value;
}

function avatar(username, color, large = false, imagePath = null, frameId = null) {
  const safeFrame = typeof frameId === 'string' && /^[a-z0-9_]{3,40}$/.test(frameId) ? frameId : '';
  const element = createElement('span', `${large ? 'profile-avatar' : 'message-avatar'} ${avatarClass(color)}${safeFrame ? ` frame-${safeFrame}` : ''}`);
  const initial = initialOf(username);
  element.setAttribute('aria-label', username || t('userFallback'));
  if (isSafeImagePath(imagePath)) {
    const image = document.createElement('img');
    image.src = imageSource(imagePath);
    // Alt metin bilinçli olarak boş: görsel yüklenemezse yazı değil,
    // kullanıcı adının baş harfi gösterilir.
    image.alt = '';
    image.setAttribute('aria-hidden', 'true');
    image.draggable = false;
    image.loading = large ? 'eager' : 'lazy';
    image.decoding = 'async';
    image.addEventListener('dragstart', (event) => event.preventDefault());
    image.addEventListener('error', () => {
      image.remove();
      element.textContent = initial;
    });
    element.append(image);
  } else {
    element.textContent = initial;
  }
  return element;
}

function formatDate(value, options = {}) {
  if (!value) return '—';
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return '—';
  return new Intl.DateTimeFormat(currentLanguage(), options).format(date);
}

function formatDateTime(value) {
  return formatDate(value, { dateStyle: 'medium', timeStyle: 'short' });
}

function formatTime(value) {
  return formatDate(value, { hour: '2-digit', minute: '2-digit' });
}

function remainingText(target) {
  // Çözümlenemeyen zaman damgası NaN üretir; Math.max(0, NaN) = NaN olduğu için
  // ekrana "NaN saat NaN dakika" yazılıyordu. Damga bozuksa süre 0 sayılır.
  const targetMs = new Date(target).getTime();
  if (!Number.isFinite(targetMs)) return '0 saat 0 dakika';
  const seconds = Math.max(0, Math.floor((targetMs - Date.now()) / 1000));
  const hours = Math.floor(seconds / 3600);
  const minutes = Math.floor((seconds % 3600) / 60);
  return `${hours} saat ${minutes} dakika`;
}

// Saklama süresi (saat). Sunucudan gelen değer bozuk/0/negatif olsa bile
// ekran asla "NaN saat" ya da "0 saat" yazmaz; yedeği sunucu varsayılanıdır.
const RETENTION_HOURS_FALLBACK = 24;
function retentionHoursValue() {
  const hours = Number(state.retentionHours);
  return Number.isFinite(hours) && hours > 0 ? hours : RETENTION_HOURS_FALLBACK;
}

// Sunucudan gelen saklama süresini uygular. Bozuk/eksik/0/negatif değer
// state'i NaN ya da 0 yapamaz (o durumda ekranda "NaN saat" görünüyordu);
// geçersizse mevcut değer korunur.
function applyRetentionHours(value) {
  const hours = Number(value);
  if (!Number.isFinite(hours) || hours <= 0) return;
  if (state.retentionHours === hours) return;
  state.retentionHours = hours;
  // Süre değiştiyse türetilmiş vade bayatlar: düşürülüp yeniden türetilir.
  state.nextCleanupAt = null;
  if (state.route === 'room' && state.currentRoom) {
    deriveRetentionFrom(msgCacheGet(state.currentRoom.id));
    updateRetentionCountdown();
  }
}

function clearTimers() {
  if (state.pollTimer) window.clearTimeout(state.pollTimer);
  if (state.roomNotificationTimer) window.clearTimeout(state.roomNotificationTimer);
  if (state.countdownTimer) window.clearInterval(state.countdownTimer);
  if (state.banTimer) window.clearInterval(state.banTimer);
  if (state.approvalTimer) window.clearTimeout(state.approvalTimer);
  if (state.sendCooldownTimer) window.clearInterval(state.sendCooldownTimer);
  state.pollTimer = null;
  state.roomNotificationTimer = null;
  state.countdownTimer = null;
  state.banTimer = null;
  state.approvalTimer = null;
  state.sendCooldownTimer = null;
  state.polling = false;
  state.retentionLoading = false;
  // Gönderim kilidi composer'a değil ZAMAN DAMGASINA bağlıdır: süre dolmadıysa
  // yeni çizilen composer kilidi devralır (bayrak burada gerçeğe eşitlenir).
  state.sendCooldownActive = sendCooldownRemainingSeconds() > 0;
  // Oda nabzı TABLOSU bir veri önbelleğidir, zamanlayıcı değildir: burada
  // SİLİNMEZ. Silinirse loadRooms -> renderHome sırası tabloyu daha doğmadan

function legacyAppVersion() {
  try {
    const m = /AsraApp\/(\d+)\.(\d+)\.(\d+)/.exec(navigator.userAgent || '');
    if (!m) return null;
    return [Number(m[1]), Number(m[2]), Number(m[3])];
  } catch (_) { return null; }
}

let nudgeObserver = null;
function ensureUpdateNudge() {
  if (state.updateNudgeDismissed || !state.user) return;
  const shell = document.querySelector('#app-shell');
  if (!shell || shell.hidden) return;
  const v = legacyAppVersion();
  if (!v) return; // tarayıcı (ya da uygulama değil)
  if (v[0] > 1 || (v[0] === 1 && v[1] > 5) || (v[0] === 1 && v[1] === 5 && v[2] >= 7)) return; // güncel
  const view = $('#app-view');
  if (!view || view.querySelector('.update-nudge')) return;
  const bar = document.createElement('div');
  bar.className = 'update-nudge';
  bar.append(createElement('span', '', t('updateNudge')));
  const dismiss = document.createElement('button');
  dismiss.type = 'button';
  dismiss.textContent = t('close');
  dismiss.addEventListener('click', () => {
    state.updateNudgeDismissed = true;
    bar.remove();
  });
  bar.append(dismiss);
  view.prepend(bar);
}

function maybeShowUpdateNudge() {
  ensureUpdateNudge();
  // Görünüm her yeniden çizildiğinde (oda listesi, profil, admin...) nudge
  // silinir; gözlemci koşullar sağlandığı sürece tekrar ekler.
  if (!nudgeObserver) {
    nudgeObserver = new MutationObserver(() => ensureUpdateNudge());
    const view = $('#app-view');
    if (view) nudgeObserver.observe(view, { childList: true });
  }
}

function banRemainingText(target) {
  const seconds = Math.max(0, Math.ceil((new Date(target).getTime() - Date.now()) / 1000));
  const days = Math.floor(seconds / 86400);
  const hours = Math.floor((seconds % 86400) / 3600);
  const minutes = Math.floor((seconds % 3600) / 60);
  const remainder = seconds % 60;
  return `${days > 0 ? `${days} gün ` : ''}${hours > 0 || days > 0 ? `${hours} saat ` : ''}${minutes} dakika ${remainder} saniye`;
}

/**
 * TEK arka plan zamanlayıcısı: hem ana ekran rozetini günceller hem de oda
 * içinde "yeni mesaj var mı?" sorusunu yanıtlar.
 *
 * SIFIR-HIT BOŞTA DÜZENİ: periyodik get_messages YOKTUR. Bunun yerine get_rooms
 * yanıtındaki okunmamış sayacı bir DEĞİŞİM DEDDEKTÖRÜ olarak kullanılır:
 * sayı değiştiyse TEK get_messages gider, değişmediyse HİÇ gitmez. Böylece
 * boşta bir oda dakikada 1 istekten fazlasını tüketmez (o da get_rooms).
 *
 * SAĞLAMLIK: bir sonraki tur, istek ATILMADAN ÖNCE zamanlayıcıya yazılır
 * (kendi kendini kuran saat). Hata, soğuma (429) veya bütçe doluluğu zinciri
 * ÖLDÜRMEZ — tur yalnızca atlanır. roomPulseGeneration, aynı anda iki zincir
 * oluşursa eskisini geçersiz kılar (çift istek sızıntısı olmaz).
 */
// Boşta ritim: sakin tur sayısına göre kademeli seyrekleşir.
// Tek doğruluk kaynağı budur; hem ilk kuruluş hem sonraki turlar bunu kullanır
// (aksi hâlde uzun süre boşta kalan sekme izleyici yeniden kurulunca 60 sn'ye
// döner ve seyreltme hiç işe yaramaz).
function roomPulseIdleInterval() {
  const quiet = Number(state.roomPulseQuietTicks || 0);
  if (quiet >= ROOM_PULSE_QUIET_TICKS * 2) return ROOM_PULSE_IDLE_MAX_MS;
  if (quiet >= ROOM_PULSE_QUIET_TICKS) return ROOM_PULSE_IDLE_STEP_MS;
  return ROOM_PULSE_IDLE_MS;
}

function startRoomPulseWatcher() {
  state.roomPulseGeneration = Number(state.roomPulseGeneration || 0) + 1;
  const generation = state.roomPulseGeneration;
  if (state.roomNotificationTimer) window.clearTimeout(state.roomNotificationTimer);

  function tick() {
    if (generation !== state.roomPulseGeneration) return; // yerini yeni zincire bıraktı
    const active = Date.now() < Number(state.roomPulseUntil || 0);
    // Boşta ritim KADEMELİ seyrekleşir: ilk ROOM_PULSE_QUIET_TICKS tur 60 sn,
    // sonra 120 sn, sonra 180 sn tavan. Hiçbir şey değişmeyen açık bir sekme
    // saatlerce 1 istek/dk yemek yerine 20 istek/saat'e iner. Sayaç herhangi
    // bir etkinlikte (mesaj gönderme, rozet değişimi, ekrana dönüş, odaya
    // giriş) sıfırlanır; yani kullanıcı başındayken gecikme 60 sn'de kalır.
    const quiet = Number(state.roomPulseQuietTicks || 0);
    const interval = active ? ROOM_PULSE_ACTIVE_MS : roomPulseIdleInterval();
    // Bir sonraki tur hemen planlanır; aşağıdaki kontroller yalnızca bu turun
    // isteğini atlar.
    state.roomNotificationTimer = window.setTimeout(tick, interval);
    if (!state.user) return;
    if (document.visibilityState !== 'visible') return;
    if (Date.now() < Number(state.requestCooldownUntil || 0)) return;
    // Arka plan bütçesi ve sekme kiralaması YALNIZCA performApiRequest içinde
    // tüketilir; burada ikinci kez tüketilmez (çift sayaç bütçeyi yarıya
    // indiriyordu). İstek uygun değilse api() sessizce 429 döndürür.
    state.roomPulseQuietTicks = quiet + 1;
    refreshRoomPulse(true).catch(() => {});
  }

  // İlk tur: kullanıcı aktif sohbet penceresindeyse (mesaj yeni gönderilmiş)
  // ritim hemen 10 sn olmalıdır; aksi hâlde boşta ritim 60 sn.
  // NOT: doğrudan ROOM_PULSE_IDLE_MS ile kurulursa hızlı pencere yok sayılır
  // ve yanıt gecikmesi 60 sn'de kalır (test bunu yakaladı).
  if (Date.now() < Number(state.roomPulseUntil || 0)) tick();
  else state.roomNotificationTimer = window.setTimeout(tick, roomPulseIdleInterval());
}

// Eski ad: ana ekran okunmamış rozeti izleyicisi. Artık oda içi tazeliği de
// aynı zamanlayıcı yönettiği için tek giriş noktası startRoomPulseWatcher.
function startUnreadWatcher() {
  startRoomPulseWatcher();
}

async function refreshRoomPulse(background = false) {
  if (!state.user || document.visibilityState !== 'visible') return;
  const payload = await api('get_rooms', { background: background });
  state.rooms = payload.rooms;
  // 1) Oda nabzı tablosunu tazele (oda içi dedektörün karşılaştırdığı değer).
  const pulse = {};
  state.rooms.forEach((room) => {
    pulse[Number(room.id)] = Math.max(0, Number(room.unread_count) || 0);
  });
  state.roomPulse = pulse;
  // 2) Ana ekrandaysa rozetleri yerinde güncelle (liste yeniden çizilmez).
  if (state.route !== 'room') {
    state.rooms.forEach((room) => {
      const card = document.querySelector(`.room-card[data-room-id="${room.id}"]`);
      if (card) renderRoomNotification(card, room);
    });
    return;
  }
  // 3) Oda içindeysek: rozet DEĞİŞTİYSE tek yakalama isteği, değişmediyse 0.
  const roomId = Number(state.currentRoom?.id || 0);
  if (!roomId || pulse[roomId] === undefined) return;
  const last = Number(state.roomUnreadPulse);
  state.roomUnreadPulse = pulse[roomId];
  if (last === -1) return; // taban çizgisi ilk kez kuruldu
  if (pulse[roomId] === last) return; // oda sakindi: HİÇ istek gitmedi
  state.roomPulseQuietTicks = 0; // oda hareketlendi: ritim yeniden hızlanır
  try {
    await fetchMessages(false);
  } catch (_) {
    // Tazeleme hatası sohbeti düşürmez; bir sonraki nabız turunda yeniden denenir.
  }
}

function safeWikipediaSources(sources) {
  const fallback = [{ title: 'Wikipedia', url: 'https://tr.wikipedia.org/wiki/Anasayfa' }];
  const candidates = Array.isArray(sources) && sources.length ? sources : fallback;
  return candidates.slice(0, 3).flatMap((source) => {
    try {
      const url = new URL(String(source?.url || ''));
      const isWikipedia = url.protocol === 'https:' && /(^|\.)wikipedia\.org$/i.test(url.hostname);
      if (!isWikipedia) return [];
      return [{ title: String(source?.title || 'Wikipedia').slice(0, 160), url: url.href }];
    } catch (_) {
      return [];
    }
  });
}

function renderAiMessages() {

    const identity = message.role === 'assistant' ? 'AI' : initialOf(state.user.username);
    const avatarElement = createElement('span', `ai-message-avatar ${message.role}`, identity);
    const bubble = createElement('div', 'ai-message-bubble');
    bubble.append(
      createElement('strong', '', message.role === 'assistant' ? 'Asra AI' : state.user.username),
      createElement('p', '', message.text)
    );

    const meta = createElement('div', 'ai-message-meta');
    if (message.role === 'assistant') {
      const sources = safeWikipediaSources(message.sources);
      const sourceList = createElement('div', 'ai-sources-list');
      sourceList.hidden = true;
      sources.forEach((source) => {
        const link = document.createElement('a');
        link.className = 'ai-source-link';
        link.href = source.url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = source.title === 'Wikipedia' ? 'Kaynak: Wikipedia' : `Kaynak: Wikipedia — ${source.title}`;
        sourceList.append(link);
      });
      const sourceToggle = createElement('button', 'ai-sources-toggle', 'Kaynaklar');
      sourceToggle.type = 'button';
      sourceToggle.setAttribute('aria-expanded', 'false');
      sourceToggle.addEventListener('click', () => {
        sourceList.hidden = !sourceList.hidden;
        sourceToggle.setAttribute('aria-expanded', String(!sourceList.hidden));
      });
      meta.append(sourceToggle, createElement('time', '', formatTime(message.created_at)));
      bubble.append(meta, sourceList);
    } else {
      meta.append(createElement('time', '', formatTime(message.created_at)));
      bubble.append(meta);
    }
    row.append(avatarElement, bubble);
    list.append(row);
  });
  list.scrollTop = list.scrollHeight;
}

async function sendAiMessage(rawMessage) {
  if (state.route !== 'ai') return;
  const message = String(rawMessage || '').trim();
  if (!message) return;
  const aiSessionId = state.aiSessionId;
  const input = $('#ai-message-input');
  const submit = $('.ai-send-button');
  if (input) input.value = '';
  state.aiMessages.push({ role: 'user', text: message, created_at: new Date().toISOString() });
  const context = state.aiMessages.slice(-10).map(({ role, text }) => ({ role, text }));
  renderAiMessages();
  if (submit) submit.disabled = true;
  const list = $('#ai-message-list');
  const typing = createElement('div', 'ai-typing', 'Asra AI yanıt hazırlıyor…');
  if (list) { list.append(typing); list.scrollTop = list.scrollHeight; }
  try {
    const result = await api('ai_chat', { method: 'POST', data: { message, context } });
    if (state.route === 'ai' && state.aiSessionId === aiSessionId) {
      const previousAssistant = [...state.aiMessages].reverse().find((item) => item.role === 'assistant');
      const reply = previousAssistant && previousAssistant.text === result.reply
        ? 'Aynı cevabı tekrar etmeyeyim. Hangi ekranda takıldığını yazarsan doğrudan o adıma odaklanırım.'
        : result.reply;
      state.aiMessages.push({
        role: 'assistant',
        text: reply,
        created_at: result.created_at,
        sources: result.sources
      });
    }
  } catch (error) {
    if (state.route === 'ai' && state.aiSessionId === aiSessionId) displayError(error);
  } finally {
    typing.remove();
    if (state.route === 'ai' && state.aiSessionId === aiSessionId) {
      if (submit) submit.disabled = false;
      renderAiMessages();
      if (input) input.focus();
    }
  }
}

window.asraOpenRoom = function(roomId) {
  const id = Number(roomId);
  if (!id) return;
  const go = (rooms) => {
    const room = (rooms || []).find((item) => Number(item.id) === id);
    if (room) enterRoom(room);
  };
  if (state.rooms && state.rooms.length) go(state.rooms);
  else loadRooms(false).then(() => go(state.rooms)).catch(() => {});
};

const INFO_CATS = [
  ['haber', '📰'],
  ['kaynak', '📚'],
  ['sohbet', '💬'],
  ['ders', '🎓'],
  ['calisma', '📄'],
  ['form', '📋']
];
const INFO_CAT_KEY = { haber: 'secHaber', kaynak: 'secKaynak', sohbet: 'secSohbet', ders: 'secDers', calisma: 'secCalisma', form: 'secForm' };

function isInfoRoom(room) {
  return room && Number(room.id) === 0;
}

function renderInfoRoom(room) {
  if (state.route === 'ai') clearAsraAiSession();
  clearTimers();
  releasePendingImage();
  state.route = 'info';
  state.currentRoom = null;
  state.infoRoom = room;
  state.infoCat = state.infoCat && state.infoRoom?.id === Number(room.id) ? state.infoCat : '';
  state.messagesSignature = '';
  setHeader(room.name, t('infoEyebrow'), true);
  const view = $('#app-view');
  view.classList.remove('chat-mode');
  view.replaceChildren();

  const heading = createElement('header', 'page-heading');
  const copy = createElement('div');
  copy.append(createElement('p', 'eyebrow', t('infoEyebrow')), createElement('h1', '', `${room.is_info ? '⭐ ' : ''}${room.name}`), createElement('p', '', room.description));
  heading.append(copy);

  const cats = createElement('nav', 'info-cats');
  cats.setAttribute('aria-label', t('infoEyebrow'));
  INFO_CATS.forEach(([cat, emoji]) => {

    item.type = 'button';
    item.dataset.cat = cat;
    item.append(createElement('span', 'info-cat-emoji', emoji), createElement('span', '', t(INFO_CAT_KEY[cat])));
    item.addEventListener('click', () => pickInfoCat(cat));

function pickInfoCat(cat) {
  if (state.route !== 'info') return;
  state.infoCat = cat;
  $$('#app-view .info-cat').forEach((el) => el.classList.toggle('active', el.dataset.cat === cat));
  const content = $('#info-content');
  content.replaceChildren();
  const title = createElement('h2', '', t(INFO_CAT_KEY[cat]));
  content.append(title);
  if (cat === 'sohbet') {
    content.append(createElement('p', 'panel-description', t('infoRoomsHint')));
    const grid = createElement('div', 'room-grid');
    (state.rooms || []).filter((r) => !r.is_info).forEach((r) => {
      const card = createElement('button', 'room-card');
      card.type = 'button';
      card.append(createElement('strong', '', r.name), createElement('small', '', r.description));
      card.addEventListener('click', () => enterRoom(r));
      grid.append(card);
    });
    content.append(grid);
    return;
  }
  if (cat === 'form') {
    renderInfoForms(content);
    return;
  }
  const loading = createElement('p', 'panel-description', t('loading'));
  content.append(loading);
  api('info_items', { query: { section: cat } }).then((payload) => {
    if (state.route !== 'info' || state.infoCat !== cat) return;
    content.replaceChildren(title);
    if (cat === 'haber' && payload.meta) {
      const refresh = createElement('p', 'info-refresh-note');
      const text = payload.meta.auto
        ? t('newsRefreshLine', {
            last: payload.meta.last_at ? formatDateTime(payload.meta.last_at) : '—',
            next: payload.meta.next_at ? formatDateTime(payload.meta.next_at) : t('newsRefreshSoon')
          })
        : t('newsRefreshOff');
      refresh.append(svgIcon('clock'), createElement('span', '', text));
      content.append(refresh);
    }
    if (cat === 'haber' && payload.meta && !payload.meta.last_ok && !payload.items.length) {
      content.append(createElement('p', 'field-note info-feed-note', t('infoFeedEmptyNote')));
    }
    if (!payload.items.length) {
      content.append(createElement('p', 'panel-description', t('infoEmpty')));
      return;
    }
    const list = createElement('div', 'info-item-list');
    payload.items.forEach((item) => list.append(buildInfoItem(item)));
    content.append(list);
  }).catch((error) => {
    if (state.route === 'info') { content.replaceChildren(title); displayError(error); }
  });
}

function buildInfoItem(item) {
  const card = createElement('article', 'info-item');
  card.dataset.itemId = String(item.id);
  const head = createElement('div', 'info-item-head');
  head.append(createElement('strong', 'info-item-title', item.title || t('infoEmpty')));
  const meta = createElement('div', 'info-item-meta');
  const badgeClass = item.source === 'feed' ? '' : (item.source === 'builtin' ? 'rehber' : 'warning');
  const badgeText = item.source === 'feed' ? t('infoFeedSource') : (item.source === 'builtin' ? t('infoBuiltin') : t('infoManual'));
  const badge = createElement('span', `badge ${badgeClass}`, badgeText);
  meta.append(badge);
  if (item.published_at) meta.append(createElement('time', '', formatDateTime(item.published_at)));
  head.append(meta);
  card.append(head);
  if (item.content) {
    const body = createElement('div', 'info-item-body');
    body.hidden = true;
    item.content.split(/\n+/).filter(Boolean).forEach((paragraph) => body.append(createElement('p', '', paragraph)));
    const toggle = button(item.content.length > 240 ? t('infoMore') : '', 'ghost-button info-item-toggle');
    toggle.hidden = item.content.length <= 240;
    toggle.addEventListener('click', () => {
      body.hidden = !body.hidden;
      toggle.textContent = body.hidden ? t('infoMore') : t('infoLess');
    });
    if (item.content.length <= 240) body.hidden = false;
    card.append(body, toggle);
  }
  if (item.link) {
    const anchor = document.createElement('a');
    anchor.className = 'secondary-button info-item-link';
    anchor.href = item.link;
    anchor.target = '_blank';
    anchor.rel = 'noopener noreferrer';
    anchor.textContent = t('infoOpenLink');
    card.append(anchor);
  }
  return card;
}

function buildFormCard(formData, container) {
  const card = createElement('article', 'form-card');
  card.dataset.formId = String(formData.id);
  const head = createElement('div', 'form-card-head');
  head.append(createElement('strong', 'form-title', formData.title));
  const meta = createElement('div', 'form-card-meta');
  meta.append(createElement('span', '', `@${formData.author}`), createElement('time', '', formatDateTime(formData.created_at)));
  if (formData.can_delete) {
    const del = button(t('formDelete'), 'ghost-button form-delete-btn');
    del.addEventListener('click', async () => {
      if (!window.confirm(t('formDeleteConfirm'))) return;
      try {
        await api('info_form_delete', { method: 'POST', data: { form_id: formData.id }, loading: true });
        renderInfoForms(container);
      } catch (error) { displayError(error); }
    });
    meta.append(del);
  }
  const report = button('📥', 'ghost-button form-report-btn');
  report.title = t('reportBtn');
  report.addEventListener('click', () => openReportModal('form', formData.id));
  meta.append(report);
  head.append(meta);
  card.append(head);
  if (formData.body) card.append(createElement('p', 'form-body', formData.body));

  const actionsRow = createElement('div', 'form-card-actions');
  const like = button(`${formData.liked ? '♥' : '♡'} ${formData.likes}`, `secondary-button form-like-btn${formData.liked ? ' active' : ''}`);
  like.addEventListener('click', async () => {
    try {
      const payload = await api('info_form_like', { method: 'POST', data: { form_id: formData.id }, loading: true });
      like.textContent = `${payload.liked ? '♥' : '♡'} ${payload.likes}`;
      like.classList.toggle('active', Boolean(payload.liked));
    } catch (error) { displayError(error); }
  });
  actionsRow.append(like);
  card.append(actionsRow);

  const repliesBox = createElement('div', 'form-replies');
  card.append(repliesBox);
  loadRepliesInto(repliesBox, formData.id);

  const composer = createElement('div', 'form-reply-composer');
  const input = document.createElement('input');
  input.className = 'form-reply-input';
  input.maxLength = 2000;
  input.placeholder = t('formReplyPh');
  input.autocomplete = 'off';
  const send = button('➤', 'primary-button form-reply-send');
  send.title = t('formReplySend');
  send.disabled = true;
  input.addEventListener('input', () => { send.disabled = !input.value.trim(); });
  const submitReply = async () => {
    const content = input.value.trim();
    if (!content) return;
    try {
      await api('info_form_reply', { method: 'POST', data: { form_id: formData.id, content }, loading: true });
      input.value = '';
      send.disabled = true;
      loadRepliesInto(repliesBox, formData.id);
    } catch (error) { displayError(error); }
  };
  send.addEventListener('click', submitReply);
  input.addEventListener('keydown', (event) => { if (event.key === 'Enter') { event.preventDefault(); submitReply(); } });
  composer.append(input, send);
  card.append(composer);
  return card;
}

async function loadRepliesInto(container, formId) {
  container.replaceChildren(createElement('p', 'panel-description form-replies-loading', t('loading')));
  try {
    const payload = await api('info_form_replies', { query: { form_id: formId } });
    if (!container.isConnected) return;
    container.replaceChildren();
    payload.replies.forEach((reply) => {
      const row = createElement('div', 'form-reply');
      row.dataset.replyId = String(reply.id);
      const head = createElement('div', 'form-reply-head');
      head.append(createElement('span', '', `@${reply.author}`), createElement('time', '', formatTime(reply.created_at)));
      const report = button('📥', 'ghost-button form-reply-report-btn');
      report.title = t('reportBtn');
      report.addEventListener('click', () => openReportModal('form_reply', reply.id));
      const like = button(`${reply.liked ? '♥' : '♡'} ${reply.likes ?? 0}`, `secondary-button form-reply-like${reply.liked ? ' active' : ''}`);
      like.title = reply.liked ? t('formLikeRemove') : t('formLikeAdd');
      like.addEventListener('click', async () => {
        try {
          const payload = await api('info_form_reply_like', { method: 'POST', data: { reply_id: reply.id }, loading: true });
          like.textContent = `${payload.liked ? '♥' : '♡'} ${payload.likes}`;
          like.classList.toggle('active', Boolean(payload.liked));
          like.title = payload.liked ? t('formLikeRemove') : t('formLikeAdd');
        } catch (error) { displayError(error); }
      });
      head.append(report, like);
      row.append(head, createElement('p', '', reply.content));
      container.append(row);
    });
  } catch (error) {
    if (container.isConnected) container.replaceChildren();
  }
}

      content.append(createElement('p', 'modal-copy', t('reportQuotaFull')));
      const actions = createElement('div', 'modal-actions');
      actions.append(button(t('close'), 'primary-button'));
      actions.firstElementChild.addEventListener('click', closeModal);
      content.append(actions);
      openModal(t('reportTitle'), content, '', false);
      return;
    }
    const note = createElement('p', 'modal-copy report-quota', t('reportQuota', { n: quota.remaining }));
    content.append(note, createElement('p', 'modal-copy', t('reportExplain')));
    const form = document.createElement('form');
    form.className = 'form-grid';
    const field = formField(t('reportReasonPh'), true);
    const reason = document.createElement('textarea');
    reason.id = 'report-reason-input';
    reason.maxLength = 1000;
    reason.rows = 4;
    reason.placeholder = t('reportReasonPh');
    field.append(reason);
    const actions = createElement('div', 'modal-actions form-field full-row');
    const cancel = button(t('cancel'), 'ghost-button');
    cancel.addEventListener('click', closeModal);
    const submit = button(t('reportSend'), 'danger-button', 'submit');
    actions.append(cancel, submit);
    form.append(field, actions);
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      try {
        await api('complaint_submit', { method: 'POST', data: { target_type: targetType, target_id: targetId, reason: reason.value.trim() }, loading: true });
        closeModal();
        toast(t('reportSent'), 'success');
      } catch (error) { displayError(error); }
    });
    content.append(form);
    openModal(t('reportTitle'), content, '', false);
    setTimeout(() => reason.focus(), 0);
  } catch (error) { displayError(error); }
}

// === YEREL MESAJ ONBELLEGI (sifir-istek odaya giris) ===
// Oda acildiginda 0 host istegi: son 200 mesaj yerel onbellegten aninda
// cizilir. Yeni mesajlar periyodik yoklamayla DEGIL, odanin okunmamis
// rozeti degistiginde tek yakalama istegiyle gelir (refreshRoomPulse);
// kullanici tazeleme yapinca resmi durum gelir ve onbellek senkronlenir.
const MSG_CACHE_MAX = 200;
function msgCacheKey(roomId) { return 'asra_msg_cache_r' + roomId; }
function msgCacheTrim(m) {
  return {
    id: m.id, user_id: m.user_id, username: m.username,
    avatar_color: m.avatar_color, profile_image_path: m.profile_image_path || null,
    active_profile_frame: m.active_profile_frame || null,
    type: m.type || 'text', content: m.content || '',
    image_path: m.image_path || null, created_at: m.created_at,
    view_count: Number(m.view_count || 0),
  };
}
function msgCacheGet(roomId) {
  try {
    const raw = localStorage.getItem(msgCacheKey(roomId));
    if (!raw) return null;
    const arr = JSON.parse(raw);
    if (!Array.isArray(arr) || !arr.length) return null;
    // SAKLAMA SÜRESİ FİLTRESİ: sunucu yalnızca son `retentionHours` saatlik
    // mesajı döndürür ve vadesi dolanları siler. Yerel önbellek ise günlerce
    // eskimiş satırları tutabiliyordu; rozeti 0 olan odaya girişte HİÇ istek
    // atılmadığı için bu HAYALET mesajlar ekranda kalıcı olarak görünüyor ve
    // geri sayım bayat damgalardan bozuluyordu. Okuma anında elenirler ve
    // önbellek kalıcı olarak da temizlenir (aynı iş her girişte tekrarlanmaz).
    const hours = retentionHoursValue();
    const now = Date.now();
    const fresh = arr.filter((m) => {
      const at = new Date(m && m.created_at).getTime();
      return Number.isFinite(at) && at + hours * 3600000 > now;
    });
    if (fresh.length !== arr.length) {
      if (fresh.length) localStorage.setItem(msgCacheKey(roomId), JSON.stringify(fresh));
      else localStorage.removeItem(msgCacheKey(roomId));
    }
    if (!fresh.length) return null;
    const meId = Number(state.user?.id || 0);
    return fresh.map((m) => Object.assign({}, m, { is_own: Number(m.user_id) === meId }));
  } catch (_) { return null; }
}
function msgCacheSet(roomId, messages) {
  try { localStorage.setItem(msgCacheKey(roomId), JSON.stringify(messages.slice(-MSG_CACHE_MAX).map(msgCacheTrim))); } catch (_) {}
}
function msgCacheAppend(roomId, msg) {
  try {
    const raw = localStorage.getItem(msgCacheKey(roomId));
    const arr = raw ? (JSON.parse(raw) || []) : [];
    const idx = arr.findIndex((m) => Number(m.id) === Number(msg.id));
    if (idx >= 0) arr[idx] = msgCacheTrim(msg); else arr.push(msgCacheTrim(msg));
    while (arr.length > MSG_CACHE_MAX) arr.shift();
    localStorage.setItem(msgCacheKey(roomId), JSON.stringify(arr));
  } catch (_) {}
}

function enterRoom(room) {
  if (state.route === 'room' && state.currentRoom?.id === room.id) return;
  // Bilgi Odası sohbet odası değildir; herhangi bir akış yanlışlıkla buraya
  // düşerse içerik görünümü açılır (sohbet boşluğu/mesaj gönderme yok).
  if (room && room.is_info) { renderInfoRoom(room); return; }
  clearTimers();
  state.route = 'room';
  state.currentRoom = room;
  state.messagesSignature = '';
  state.nextCleanupAt = null;
  state.retentionLoading = false;
  state.pollBackoff = 0;
  $('#app-view').classList.add('chat-mode');
  setHeader(room.name, t('roomHint'), true);
  renderChatLayout();
  const cached = msgCacheGet(room.id);
  // Odanın okunmamış rozeti (get_rooms tazelemesinden) değişim dedektörüdür.
  const knownPulse = state.roomPulse && state.roomPulse[Number(room.id)] !== undefined
    ? Number(state.roomPulse[Number(room.id)])
    : -1;
  if (cached && cached.length) {
    // SIFIR ISTEK: yerel onbellegten aninda ciz (host'a hic gitmeden).
    state.messagesSignature = cached.map((m) => `${m.id}:${m.view_count}:${m.profile_image_path || ''}:${m.active_profile_frame || ''}`).join('|');
    renderMessages(cached, true);
    // Sıfır-istek yolunda fetchMessages() HİÇ çalışmayabilir (rozet 0 ise
    // yakalama isteği de gitmez). Geri sayımın tek türetme/çizim noktası
    // orası olduğu için sayaç "hesaplanıyor…" yer tutucusunda takılı
    // kalıyordu. Vade burada, önbellekten ve İSTEK ATMADAN türetilir.
    deriveRetentionFrom(cached);
    // Rozet 0 ise oda "her şeyi okundu" demektir: yakalama isteği GEREKMEZ,
    // oda girişi gerçekten 0 istek olur. Rozet > 0 ise onbellek eskidir ve
    // TEK yakalama isteği atılır; sonra dedektör normal çalışır.
    if (knownPulse !== 0) fetchMessages(false).catch(() => {});
  } else {
    // İlk ziyaret: önbellek yok, vade sunucudan gelecek. Yükleme bitene
    // kadar dürüst yer tutucu gösterilir; istek BAŞARISIZ olsa bile bayrak
    // düşürülür ki sayaç yer tutucuda takılı kalmasın.
    state.retentionLoading = true;
    fetchMessages(true)
      .catch(displayError)
      .finally(() => {
        state.retentionLoading = false;
        updateRetentionCountdown();
      });
  }
  // Giriş yolu ne olursa olsun sayaç metni KESİNLEŞTİRİLİR ve yerel
  // zamanlayıcı kurulur (zamanlayıcı istek üretmez, yalnızca metni tazeler).
  updateRetentionCountdown();
  startRetentionCountdownTimer();
  // Dedektör taban çizgisi: şu anki rozet değeri. İlk nabız turunda gerçek
  // değerle karşılaştırılır; fark varsa tek tazeleme gider.
  state.roomUnreadPulse = knownPulse;
  scheduleMessagePoll();
  // clearTimers() nabız izleyicisini de durdurur; oda içinde canlılığı artık
  // yalnızca o sağladığı için burada yeniden kurulur (periyodik yoklama YOK).
  startRoomPulseWatcher();
}

/**
 * Periyodik mesaj yoklaması KALDIRILDI (sıfır-hit boşta düzeni).
 *
 * Eski düzen odada boşta 45 sn'de bir get_messages atıyordu (1,33 istek/dk).
 * Yerine: odanın okunmamış rozeti değişim dedektörü olarak kullanılır ve
 * yalnızca rozet DEĞİŞTİĞİNDE tek get_messages gider (bkz. refreshRoomPulse).
 * Bu fonksiyon, mevcut çağrı yerlerinin anlamını korumak için tutulur ve
 * yalnızca eski bir zamanlayıcı kaldıysa onu temizler — yeni istek üretmez.
 */
function scheduleMessagePoll() {
  if (state.pollTimer) {
    window.clearTimeout(state.pollTimer);
    state.pollTimer = null;
  }
}

/**
 * Kullanıcı sohbete katıldığında (mesaj gönderdiğinde) nabız izleyicisini
 * kısa süreliğine hızlandırır: karşı tarafın yanıtı 10 sn içinde görünür.
 * Pencere kapanınca ritim kendiliğinden 60 sn'ye döner; boşta maliyet
 * değişmez (dakikada 1 istek).
 */
function notifyRoomActivity() {
  state.roomPulseUntil = Date.now() + ROOM_PULSE_ACTIVE_WINDOW_MS;
  // Kullanıcı aktif: seyreltme sayacı sıfırlanır, ritim hemen 10 sn'ye döner.
  state.roomPulseQuietTicks = 0;
}
