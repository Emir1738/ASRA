    const label = createElement('label', 'announcement-room-option');
    const input = document.createElement('input');
    input.type = 'checkbox';
    input.name = 'room_ids';
    input.value = String(room.id);
    input.checked = room.name === 'Asra Genel';
    label.append(input, createElement('span', '', room.name));
    grid.append(label);
    return input;
  });
  const updateSelection = () => {
    const count = roomInputs.filter((input) => input.checked).length;
    selectedCount.textContent = `${count} oda seçildi`;
    selectAll.checked = count === roomInputs.length && count > 0;
    selectAll.indeterminate = count > 0 && count < roomInputs.length;
  };
  selectAll.addEventListener('change', () => {
    roomInputs.forEach((input) => { input.checked = selectAll.checked; });
    updateSelection();
  });
  roomInputs.forEach((input) => input.addEventListener('change', updateSelection));
  updateSelection();
  selection.append(legend, selectAllRow, grid);

  const submit = button('Duyuruyu Seçilen Odalara Gönder', 'primary-button', 'submit');
  form.append(textarea, selection, submit);
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const roomIds = roomInputs.filter((input) => input.checked).map((input) => Number(input.value));
    if (!roomIds.length) {
      toast('Duyurunun gönderileceği en az bir oda seçin.', 'warning');
      return;
    }
    try {
      const result = await api('admin_send_announcement', {
        method: 'POST',
        data: { message: textarea.value, room_ids: roomIds },
        loading: true
      });
      textarea.value = '';
      toast(`Duyuru ${result.room_count} odaya gönderildi.`);
    } catch (error) {
      if (error.code === 'ADMIN_REQUIRED') { state.adminActive = false; openAdmin(); return; }
      displayError(error);
    }
  });
  container.append(form);
}

function openModal(title, content, kicker = '', wide = false, cleanup = null) {
  if (state.modalCleanup) state.modalCleanup();
  state.modalCleanup = cleanup;
  $('#modal-title').textContent = title;
  $('#modal-kicker').textContent = kicker;
  $('#modal-content').replaceChildren(content);
  $('#modal').classList.toggle('wide', wide);
  $('#modal-backdrop').hidden = false;
  document.body.classList.add('modal-open');
  $('#modal-close').focus();
}

function closeModal() {
  if (state.modalCleanup) state.modalCleanup();
  state.modalCleanup = null;
  $('#modal-backdrop').hidden = true;
  $('#modal-content').replaceChildren();
  document.body.classList.remove('modal-open');
}

const guardedControlState = new WeakMap();
const guardedFormState = new WeakMap();
const GENTLE_ACTION_LOCK_MS = 3000;

function lockControlBriefly(control, duration = GENTLE_ACTION_LOCK_MS) {
  if (!(control instanceof HTMLElement)) return false;
  const now = Date.now();
  const current = guardedControlState.get(control);
  if (current && current.until > now) return false;

  if (current?.timer) window.clearTimeout(current.timer);
  const originalAriaDisabled = control.getAttribute('aria-disabled');
  const entry = { until: now + duration, timer: null, originalAriaDisabled };
  control.classList.add('temporarily-locked');
  control.setAttribute('aria-disabled', 'true');
  entry.timer = window.setTimeout(() => {
    if (guardedControlState.get(control) !== entry) return;
    control.classList.remove('temporarily-locked');
    if (entry.originalAriaDisabled === null) control.removeAttribute('aria-disabled');
    else control.setAttribute('aria-disabled', entry.originalAriaDisabled);
    guardedControlState.delete(control);
  }, duration);
  guardedControlState.set(control, entry);
  return true;
}

/**
 * Çift dokunuş kilidini geri alır.
 *
 * Kilit, AYAKTA bir ağ isteği varken aynı eylemin tekrar gönderilmesini
 * engeller. İstemci tarafında reddedilen ya da hata yanıtıyla dönen bir
 * gönderim ayakta istek BIRAKMAZ; kilit öyle de sürerse kullanıcı alanı
 * düzeltip tekrar bastığında dokunuşu 3 sn boyunca SESSİZCE yutulur ve form
 * bozuk görünür. lockControlBriefly yalnızca sınıf/aria yazdığı için kilidi
 * geri alan tek yer burasıdır: zamanlayıcı iptal edilir, görsel durum eski
 * hâline döndürülür ve WeakMap kayıtları silinir (zamanlayıcının kendi
 * geri çağrısı kayıt silindiğini görüp zararsızca çıkar).
 */
function releaseActionLock(...elements) {
  elements.forEach((element) => {
    if (!(element instanceof HTMLElement)) return;
    const entry = guardedControlState.get(element);
    if (entry) {
      if (entry.timer) window.clearTimeout(entry.timer);
      element.classList.remove('temporarily-locked');
      if (entry.originalAriaDisabled === null) element.removeAttribute('aria-disabled');
      else element.setAttribute('aria-disabled', entry.originalAriaDisabled);
      guardedControlState.delete(element);
    }
    if (element instanceof HTMLFormElement) guardedFormState.delete(element);
  });
}

function installGentleActionGuard() {
  const guardedSelector = [
    'button[type="submit"]', '.room-card', '.asra-ai-card', '.ai-suggestion-button',
    '[data-menu-action]', '#back-button', '#brand-button', '.primary-button',
    '.secondary-button', '.danger-button'
  ].join(',');

  document.addEventListener('click', (event) => {
    const control = event.target.closest?.(guardedSelector);
    if (!control || control.closest('.composer, .ai-composer') || control.hasAttribute('data-no-action-lock')) return;
    if (!lockControlBriefly(control)) {
      event.preventDefault();
      event.stopImmediatePropagation();
    }
  }, true);

  document.addEventListener('submit', (event) => {
    const form = event.target;
    if (!(form instanceof HTMLFormElement) || form.matches('.composer, .ai-composer')) return;
    const now = Date.now();
    const lockedUntil = guardedFormState.get(form) || 0;
    if (lockedUntil > now) {
      event.preventDefault();
      event.stopImmediatePropagation();
      return;
    }
    guardedFormState.set(form, now + GENTLE_ACTION_LOCK_MS);
    const submit = form.querySelector('button[type="submit"], input[type="submit"]');
    if (submit) lockControlBriefly(submit);
    window.setTimeout(() => {
      if ((guardedFormState.get(form) || 0) <= Date.now()) guardedFormState.delete(form);
    }, GENTLE_ACTION_LOCK_MS + 50);
  }, true);
}

function bindStaticEvents() {
  installGentleActionGuard();
  $('#login-form').addEventListener('submit', async (event) => {
    event.preventDefault();
    const data = Object.fromEntries(new FormData(event.currentTarget));
    try {
      const payload = await api('login', { method: 'POST', data, loading: true, minLoadingMs: 3000 });
      if (payload.csrf_token) state.csrf = payload.csrf_token;
      mergeUserFromPayload(payload.user);
      state.adminActive = false;
      if (payload.approval_required || payload.user?.approval_status === 'pending') {
        openApprovalFlow(payload.approval || { submitted: false });
      } else {
        showApp();
        await loadRooms(false);
      }
    } catch (error) {
      if (error.details?.csrf_token) state.csrf = error.details.csrf_token;
      if (error.code === 'ACCOUNT_DELETED') showDeletedStatus(error.details);
      else if (error.code === 'APPROVAL_PENDING') openApprovalFlow(error.details || { submitted: false });
      else if (error.code !== 'ACCOUNT_BANNED') displayError(error);
    }
  });

  $('#register-form').addEventListener('submit', async (event) => {
    event.preventDefault();
    const data = Object.fromEntries(new FormData(event.currentTarget));
    try {
      const payload = await api('register', { method: 'POST', data, loading: true, minLoadingMs: 3000 });
      if (payload.csrf_token) state.csrf = payload.csrf_token;
      mergeUserFromPayload(payload.user);
      state.adminActive = false;
      if (payload.approval_required || payload.user?.approval_status === 'pending') {
        openApprovalFlow(payload.approval || { submitted: false });
      } else {
        showApp();
        await loadRooms(false);
      }
    } catch (error) { displayError(error); }
  });

  $('#login-tab').addEventListener('click', () => switchAuthTab('login'));
  $('#register-tab').addEventListener('click', () => switchAuthTab('register'));
  $$('.password-toggle').forEach((toggle) => toggle.addEventListener('click', () => {
    const input = $('input', toggle.parentElement);
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    toggle.textContent = show ? t('hide') : t('show');
  }));

  $('#coin-pill').addEventListener('click', () => renderShop().catch(displayError));
  $('#menu-button').addEventListener('click', (event) => {
    event.stopPropagation();
    const menu = $('#account-menu');
    menu.hidden = !menu.hidden;
    $('#menu-button').setAttribute('aria-expanded', String(!menu.hidden));
  });
  $('#account-menu').addEventListener('click', (event) => {
    const target = event.target.closest('[data-menu-action]');
    if (!target) return;
    $('#account-menu').hidden = true;
    $('#menu-button').setAttribute('aria-expanded', 'false');
    const action = target.dataset.menuAction;
    if (action === 'profile') renderProfile().catch(displayError);
    if (action === 'shop') renderShop().catch(displayError);
    if (action === 'quests') renderQuestHub().catch(displayError);
    if (action === 'settings') renderSettings();
    if (action === 'admin') openAdmin();
    if (action === 'refresh') openRefreshPrompt();
    if (action === 'logout') performLogout();
  });
  document.addEventListener('click', (event) => {
    if (!event.target.closest('#account-menu') && !event.target.closest('#menu-button')) {
      $('#account-menu').hidden = true;
      $('#menu-button').setAttribute('aria-expanded', 'false');
    }
  });
  $('#back-button').addEventListener('click', renderHome);
  $('#brand-button').addEventListener('click', () => { if (state.user) renderHome(); });
  $('#modal-close').addEventListener('click', closeModal);
  $('#modal-backdrop').addEventListener('click', (event) => { if (event.target === event.currentTarget) closeModal(); });
  document.addEventListener('keydown', (event) => { if (event.key === 'Escape' && !$('#modal-backdrop').hidden) closeModal(); });
  $('#image-input').addEventListener('change', handleImageSelection);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') {
      releaseBackgroundPollingLease();
      return;
    }
    if (!state.user) return;
    if (document.visibilityState === 'visible') {
      state.pollBackoff = 0;
      state.roomPollBackoff = 0;
      state.roomPulseQuietTicks = 0; // ekrana dönüş: ritim baştan başlar
      // Ekrana dönüş kullanıcı kaynaklı bir tazelemedir: tek yakalama isteği
      // gider (görünmezken geçen süre boyunca biriken mesajlar için), sonra
      // nabız izleyicisi devralır. Periyodik yoklama başlatılmaz.
      if (state.route === 'room' && state.currentRoom) fetchMessages(false).catch(() => {});
      refreshRoomPulse().catch(() => {});
      startRoomPulseWatcher();
    }
  });
  window.addEventListener('online', () => {
    setConnection(true);
    state.requestCooldownUntil = 0;
    state.serviceErrorCount = 0;
    if (state.route === 'room' && state.currentRoom) fetchMessages(false).catch(() => {});
    if (state.user) {
      refreshRoomPulse().catch(() => {});
      startRoomPulseWatcher();
    }
  });
  window.addEventListener('offline', () => setConnection(false));
  window.addEventListener('beforeunload', () => {
    releaseBackgroundPollingLease();
    releasePendingImage();
    clearAsraAiSession();
  });
}

function switchAuthTab(tab) {
  const login = tab === 'login';
  $('#login-tab').classList.toggle('active', login);
  $('#register-tab').classList.toggle('active', !login);
  $('#login-tab').setAttribute('aria-selected', String(login));
  $('#register-tab').setAttribute('aria-selected', String(!login));
  $('#login-form').hidden = !login;
  $('#register-form').hidden = login;
  (login ? $('#login-username') : $('#register-username')).focus();
}

/**
 * Önbelleği atlayan yenileme adresi üretir: yeni sürüm yüklendiğinde tarayıcı
 * eski dosyaları değil, güncel dosyaları alır.
 */
function buildRefreshUrl() {
  const url = new URL(window.location.href);
  url.searchParams.delete('_');
  url.searchParams.set('_', String(Date.now()));
  return url.toString();
}

async function performAppRefresh() {
  clearTimers();
  releasePendingImage();
  setLoading(true, t('refreshingNow'), t('refreshing'));
  try {
    if (window.caches?.keys) {
      const keys = await window.caches.keys();
      await Promise.all(keys.map((key) => window.caches.delete(key)));
    }
  } catch (_) { /* Önbellek erişimi kapalı olabilir. */ }
  try {
    const registrations = await navigator.serviceWorker?.getRegistrations?.();
    if (registrations?.length) await Promise.all(registrations.map((registration) => registration.unregister()));
  } catch (_) { /* Servis çalışanı yoksa sorun değil. */ }
  // Not: eski sürümlerin kaydettiği servis işçisi burada sökülür.
  window.location.replace(buildRefreshUrl());
}

function openRefreshPrompt() {
  const content = createElement('div');
  content.append(
    createElement('p', 'modal-copy', t('refreshTitle')),
    createElement('p', 'field-note', t('refreshNote'))
  );
  const actions = createElement('div', 'modal-actions');
  const cancel = button(t('cancel'), 'ghost-button');
  cancel.addEventListener('click', closeModal);
  const refresh = button(t('menuRefresh'), 'primary-button');
  refresh.addEventListener('click', () => {
    refresh.disabled = true;
    closeModal();
    performAppRefresh();
  });
  actions.append(cancel, refresh);
  content.append(actions);
  openModal(t('menuRefresh'), content, t('refreshKicker'));
  window.setTimeout(() => refresh.focus(), 0);
}

async function performLogout() {
  try {
    await api('logout', { method: 'POST', loading: true, loadingTitle: t('closingSession') });
    try { localStorage.removeItem('asra_active_session'); } catch (_) {}
    window.location.reload();
  } catch (error) {
    displayError(error);
  }
}

let recoveryInProgress = false;

async function initialize() {
  recoveryInProgress = false;
  applyTheme((() => { try { return localStorage.getItem('asra_theme'); } catch (_) { return null; } })() || 'dark');
  applyLanguage();
  const hadActiveSession = (() => { try { return localStorage.getItem('asra_active_session') === '1'; } catch (_) { return false; } })();
  let sessionAuthenticated = false;
  bindStaticEvents();
  setLoading(true, 'Asra Chat', t('secureConn'));
  try {
    const payload = await api('session');
    state.csrf = payload.csrf_token;
    state.adminActive = Boolean(payload.admin_authenticated);
    state.deviceBound = Boolean(payload.device_has_account);
    state.boundUsername = payload.bound_username || '';
    handleApprovalBlock(payload.approval_block);
    if (payload.approval_required) {
      mergeUserFromPayload(payload.user);
      openApprovalFlow(payload.approval || { submitted: false });
    } else if (payload.authenticated) {
      sessionAuthenticated = true;
      mergeUserFromPayload(payload.user);
      showApp();
      await loadRooms(false);
    } else {
      showAuth();
    }
  } catch (error) {
    const transientUpdateError = ['NETWORK_ERROR', 'REQUEST_TIMEOUT', 'SERVICE_BUSY', 'REQUEST_FAILED', 'RATE_LIMITED', 'HOST_LIMIT_REACHED', 'REQUEST_COOLDOWN'].includes(error.code);
    if ((hadActiveSession || sessionAuthenticated) && transientUpdateError) {
      // ÖNEMLİ: Sayfayı yeniden yüklemek, 320 KB'lık uygulama kabuğunu ve her seferinde
      // session + get_rooms isteklerini yeniden tetikler. Hosting "hits" kotası aşıldığında
      // bu, iyileşmeyi geciktiren bir reload fırtınasına dönüşür. Burada sayfayı YENİDEN
      // YÜKLEMEDEN (in-place), sınırlı ve üstel aralıkla oturum bağlantısı yeniden kurulur;
      // böylece sunucuya giden istek sayısı ve kotaya vuruş en aza iner.
      const protectedWait = ['RATE_LIMITED', 'HOST_LIMIT_REACHED', 'REQUEST_COOLDOWN'].includes(error.code);
      const retrySeconds = Math.min(300, protectedWait
        ? Math.max(30, Math.min(300, Number(error.details?.retry_after) || 60))
        : Math.min(30, 3 * (2 ** recoveryCount)));
      recoveryCount = Math.min(recoveryCount + 1, 8);
      recoveryInProgress = true;
      $('#auth-screen').hidden = true;
      $('#status-screen').hidden = true;
      $('#app-shell').hidden = true;
      setLoading(
        true,
        protectedWait ? t('protectionActive') : t('applyingUpdate'),
        t('sessionKept', { seconds: retrySeconds })
      );
      window.setTimeout(() => initialize(), retrySeconds * 1000);
      return;
    }
    if (!['ACCOUNT_BANNED', 'ACCOUNT_DELETED', 'SESSION_REVOKED'].includes(error.code)) {
      showAuth();
      displayError(error);
    }
  } finally {
    if (!recoveryInProgress) setLoading(false);
  }
}

let recoveryCount = 0;

initialize();
  </script>
