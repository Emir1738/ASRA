// Sunucu geri sayımı yalnızca odaya İLK girişte (meta=1) ve odada mesaj
// varsa gönderir. Boş odaya girip mesaj yazınca geri sayım hiç başlamıyordu;
// bu yüzden elimizdeki mesaj listesinden EK İSTEK ATILMADAN türetilir.
//
// Vadesi dolmuş damgalar elenir: yerel önbellek (localStorage) saklama
// süresinden daha eski mesajları tutmaya devam edebildiği için bunlar
// sayaca alınırsa vade GEÇMİŞTE kalır ve metin kalıcı olarak kilitlenir.
function retentionDeadlineFrom(messages) {
  if (!Array.isArray(messages) || !messages.length) return null;
  const hours = retentionHoursValue();
  const now = Date.now();
  let oldest = Infinity;
  messages.forEach((message) => {
    const at = new Date(message && message.created_at).getTime();
    if (!Number.isFinite(at)) return;
    if (at + hours * 3600000 <= now) return; // vadesi dolmuş: sayaç üretmez
    if (at < oldest) oldest = at;
  });
  return Number.isFinite(oldest) && oldest !== Infinity
    ? new Date(oldest + hours * 3600000).toISOString()
    : null;
}

function deriveRetentionFrom(messages) {
  if (state.nextCleanupAt) return;
  const deadline = retentionDeadlineFrom(messages);
  if (deadline) state.nextCleanupAt = deadline;
}

// Geri sayım zamanlayıcısı YALNIZCA ekrandaki metni tazeler; hiçbir ağ
// isteği üretmez, dolayısıyla hit bütçesine dokunmaz. Oda dışında
// clearTimers() tarafından durdurulur.
const RETENTION_TICK_MS = 30000;
function startRetentionCountdownTimer() {
  if (state.countdownTimer || state.route !== 'room') return;
  state.countdownTimer = window.setInterval(updateRetentionCountdown, RETENTION_TICK_MS);
}

function updateRetentionCountdown() {
  const element = $('.room-notice .countdown');
  if (!element) return;
  const hours = retentionHoursValue();

  // Süresi biten vade eskiden "temizleniyor…"a düşüp bir daha asla
  // türetilmediği için ORADA KALICI KİLİTLENİYORDU. Artık bayat vade
  // düşülür ve elde kalan mesajlardan yeniden türetilir: odada geçerli
  // mesaj varsa sayaç doğru yerden devam eder, yoksa dürüst durum yazılır.
  if (state.nextCleanupAt) {
    const deadlineMs = new Date(state.nextCleanupAt).getTime();
    if (!Number.isFinite(deadlineMs) || deadlineMs <= Date.now()) {
      state.nextCleanupAt = null;
      deriveRetentionFrom(msgCacheGet(state.currentRoom && state.currentRoom.id));
    }
  }

  // İki dürüst durum, hiçbiri yapışkan değildir:
  //   vade belli          -> canlı sayaç
  //   ilk yükleme sürüyor -> "hesaplanıyor…" (istek bitsin ya da KALSIN, mutlaka değişir)
  //   yükleme bitti, odada geçerli mesaj yok -> "oda boş"
  // Yükleme bitmeden "oda boş" yazmak, dolu bir oda için yanlış bilgi olurdu.
  // Vadesi dolmuş satırlar msgCacheGet() içinde elendiği için burada ayrıca
  // bir "temizleniyor…" ara durumu gerekmez: süresi dolan mesaj sunucuda da
  // istemcide de aynı anda görünmez olur.
  let tail;
  if (state.nextCleanupAt) {
    tail = remainingText(state.nextCleanupAt);
  } else if (state.retentionLoading) {
    tail = t('retentionCalculating');
  } else {
    tail = t('roomEmptyFirst');
  }
  element.replaceChildren(svgIcon('clock'), document.createTextNode(`${t('retentionLine', { hours })} · ${tail}`));
}

async function refreshSessionState() {
  const payload = await api('session', { noDedupe: true });
  if (!payload) return;
  if (payload.csrf_token) state.csrf = payload.csrf_token;
  if (typeof payload.hit_economy === 'boolean') state.hitEconomy = payload.hit_economy;
  applyRetentionHours(payload.message_retention_hours);
  if (payload.user) mergeUserFromPayload(payload.user);
}

// Yerel (sunucusuz) mesaj satırı: optimistik gönderimde kullanılır.
// Resmî render ile AYNI örnekleyiciyi (buildMessageRow) kullandığı için
// silme butonu, görenler, profil ve görsel eylemleri yerel satırda da
// tam olarak çalışır.
function renderLocalRow(msg) {
  if (msg.type === 'system') {
    const row = document.createElement('article');
    const sys = document.createElement('div');
    sys.className = 'system-message' + (/^DUYURU:/i.test(msg.content) ? ' announcement-message' : ' welcome-message');
    sys.append(document.createTextNode(msg.content.replace(/^DUYURU:\s*/i, '').trim() || t('systemMessage')));
    row.append(sys);
    return row;
  }
  const row = buildMessageRow(msg, false);
  row.dataset.localId = String(msg.id);
  return row;
}

async function fetchMessages(initial = false) {
  if (state.polling || !state.currentRoom) return false;
  state.polling = true;
  const roomId = state.currentRoom.id;
  try {
    const payload = await api('get_messages', {
      query: initial ? { room_id: roomId, meta: 1 } : { room_id: roomId },
      background: !initial
    });
    if (!state.currentRoom || state.currentRoom.id !== roomId) return false;
    if (payload.next_cleanup_at) state.nextCleanupAt = payload.next_cleanup_at;
    const messages = payload.messages;
    msgCacheSet(roomId, messages); // onbellegi resmi durumla sinirla
    // Önbellek ÖNCE yazılır: sayaç, "odada bilinen mesaj var mı" kararını
    // bu önbellekten okuduğu için eski değerle yanlış metin göstermesin.
    deriveRetentionFrom(messages);
    updateRetentionCountdown();
    startRetentionCountdownTimer();
    const signature = messages.map((message) => `${message.id}:${message.view_count}:${message.profile_image_path || ''}:${message.active_profile_frame || ''}`).join('|');
    const changed = initial || signature !== state.messagesSignature;
    if (changed) {
      state.messagesSignature = signature;
      renderMessages(messages, initial);
    }
    state.pollBackoff = 0;
    return changed;
  } catch (error) {
    throw error;
  } finally {
    state.polling = false;
  }
}

function messageDateKey(value) {
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return '';
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
}

function messageDayLabel(value) {
  const date = new Date(value);
  const today = new Date();
  const yesterday = new Date();
  yesterday.setDate(today.getDate() - 1);
  const key = messageDateKey(value);
  if (key === messageDateKey(today)) return t('dayToday');
  if (key === messageDateKey(yesterday)) return t('dayYesterday');
  return formatDate(date.toISOString(), { day: 'numeric', month: 'long', year: 'numeric' });
}

function messagesBelongTogether(previous, current) {
  if (!previous || previous.type === 'system' || current.type === 'system') return false;
  if (previous.user_id !== current.user_id || messageDateKey(previous.created_at) !== messageDateKey(current.created_at)) return false;
  return new Date(current.created_at).getTime() - new Date(previous.created_at).getTime() <= 5 * 60 * 1000;
}

// ORTAK SATIR ÖRNEKLEYİCİSİ: resmî çizim (renderMessages) ve yerel
// çizim (renderLocalRow) AYNI satırı üretir — silme butonu, görenler,
// profil, görsel eylemleri ve tüm etkileşimler her iki yolda da var.
// (İki ayrı render kodu tutulması, yerel satırlardan etkileşimlerin
// kaybolmasına yol açmıştı; kök düzeltme tek paylaşılan üreticidir.)
function buildMessageRow(message, grouped = false) {
  const displayContent = repairLegacyTurkishText(message.content);
  const displayUsername = repairLegacyTurkishText(message.username) || t('userFallback');
  const row = createElement('article', `message-row${message.is_own ? ' own' : ''}${grouped ? ' grouped' : ''}`);
  row.dataset.msgId = String(message.id);
  const avatarButton = avatar(displayUsername, message.avatar_color, false, message.profile_image_path, message.active_profile_frame);
  avatarButton.setAttribute('role', 'button');
  avatarButton.tabIndex = 0;
  avatarButton.title = displayUsername;
  const openProfile = (event) => {
    event.stopPropagation();
    renderProfile(message.user_id).catch(displayError);
  };
  avatarButton.addEventListener('click', openProfile);
  avatarButton.addEventListener('keydown', (event) => { if (event.key === 'Enter' || event.key === ' ') openProfile(event); });

  const wrap = createElement('div', 'bubble-wrap');
  const bubble = createElement('div', 'message-bubble');
  if (message.is_own) {
    bubble.tabIndex = 0;
    bubble.setAttribute('role', 'button');
    bubble.setAttribute('aria-label', t('deleteMessageAria'));
    const messageActions = createElement('button', 'message-actions-button');
    messageActions.type = 'button';
    messageActions.append(svgIcon('more'));
    messageActions.setAttribute('aria-label', t('deleteMessage'));
    messageActions.title = t('deleteMessage');
    messageActions.addEventListener('click', (event) => {
      event.stopPropagation();
      openMessageOptions(message);
    });
    bubble.append(messageActions);
  }
  const author = createElement('button', 'message-author', displayUsername);
  author.type = 'button';
  author.addEventListener('click', openProfile);
  bubble.append(author);
  if (isSafeImagePath(message.image_path)) {
    const image = document.createElement('img');
    image.className = 'message-image';
    image.src = imageSource(message.image_path);
    image.alt = displayContent ? t('imageAttached') : t('sharedImage');
    image.loading = 'eager';
    image.decoding = 'async';
    image.draggable = false;
    image.addEventListener('dragstart', (event) => event.preventDefault());
    image.addEventListener('error', () => {
      const fallback = createElement('small', 'field-note', t('imageFail'));
      image.replaceWith(fallback);
    });
    image.addEventListener('click', (event) => {
      event.stopPropagation();
      if (message.is_own) openMessageOptions(message);
      else openImageActions(message);
    });
    bubble.append(image);
  }
  if (displayContent) bubble.append(createElement('p', 'message-text', displayContent));
  const meta = createElement('div', 'message-meta');
  meta.append(createElement('time', '', formatTime(message.created_at)));
  const viewers = createElement('button', 'viewers-button', `${Number(message.view_count) || 0} ${t('seenBy')}`);
  viewers.type = 'button';
  viewers.addEventListener('click', (event) => {
    event.stopPropagation();
    // KÖK DÜZELTME: kimlik TIKLAMA ANINDA satırdan okunur. Yerel çizilen satır
    // sunucuya teslim edilince row.dataset.msgId resmî id'ye döner, ama bu
    // dinleyicinin yakaladığı message.id yerel kimlikte ("local-…") kalıyordu;
    // Number() NaN üretip buton SESSİZCE hiçbir şey yapmıyordu.
    const row = viewers.closest('.message-row');
    const mid = Number(row?.dataset.msgId) || Number(state.localIdMap?.[message.id]) || Number(message.id) || 0;
    if (!Number.isFinite(mid) || mid <= 0) {
      toast(t('sendingNote'), 'info');
      return;
    }
    openViewers(mid).catch(displayError);
  });
  meta.append(viewers);
  if (!message.is_own && message.user_id) {
    const report = document.createElement('button');
    report.type = 'button';
    report.className = 'message-report-btn';
    report.textContent = '📥';
    report.title = t('reportBtn');
    report.setAttribute('aria-label', t('reportBtn'));
    report.addEventListener('click', (event) => {
      event.stopPropagation();
      const row = report.closest('.message-row');
      const mid = Number(row?.dataset.msgId) || Number(message.id) || 0;
      if (mid > 0) openReportModal('chat', mid); else toast(t('sendingNote'), 'info');
    });
    meta.append(report);
  }
  bubble.append(meta);
  const openOptions = () => { if (message.is_own) openMessageOptions(message); };
  if (message.is_own) bubble.addEventListener('click', openOptions);
  bubble.addEventListener('contextmenu', (event) => {
    event.preventDefault();
    openOptions();
  });
  bubble.addEventListener('copy', (event) => event.preventDefault());
  if (message.is_own) bubble.addEventListener('keydown', (event) => { if (event.key === 'Enter' || event.key === ' ') openOptions(); });
  wrap.append(bubble);
  row.append(avatarButton, wrap);
  return row;
}

function renderMessages(messages, forceBottom = false) {
  const list = $('#message-list');
  if (!list) return;
  const wasNearBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 140;
  list.replaceChildren();
  if (!messages.length) {
    const empty = createElement('div', 'empty-state');
    empty.append(createElement('div', 'empty-state-icon', '✦'), createElement('h3', '', t('noMessages')), createElement('p', '', t('noMessagesText')));
    list.append(empty);
    return;
  }

  let previousMessage = null;
  let previousDate = '';
  messages.forEach((message) => {
    const displayContent = repairLegacyTurkishText(message.content);
    const currentDate = messageDateKey(message.created_at);
    if (currentDate && currentDate !== previousDate) {
      const divider = createElement('div', 'date-divider');
      divider.append(createElement('span', '', messageDayLabel(message.created_at)));
      list.append(divider);
      previousDate = currentDate;
    }
    if (message.type === 'system') {
      const isAnnouncement = /^DUYURU:\s*/i.test(displayContent);
      const systemMessage = createElement('article', `system-message${isAnnouncement ? ' announcement-message' : ' welcome-message'}`);
      if (isAnnouncement) {
        const announcementIcon = createElement('span', 'announcement-icon');
        announcementIcon.append(svgIcon('announcement'));
        const announcementCopy = createElement('div', 'announcement-copy');
        announcementCopy.append(
          createElement('strong', 'announcement-label', 'TOPLULUK DUYURUSU'),
          createElement('p', 'announcement-text', displayContent.replace(/^DUYURU:\s*/i, '').trim()),
          createElement('time', 'announcement-time', formatTime(message.created_at))
        );
        systemMessage.append(announcementIcon, announcementCopy);
        const announcementActions = createElement('button', 'announcement-actions-button');
        announcementActions.type = 'button';
        announcementActions.append(svgIcon('more'));
        announcementActions.setAttribute('aria-label', 'Duyuru yönetimi');
        announcementActions.title = 'Duyuru yönetimi';
        announcementActions.addEventListener('click', () => openAnnouncementAdminMenu(message));
        systemMessage.append(announcementActions);
      } else {
        systemMessage.append(svgIcon('spark'), document.createTextNode(displayContent || t('systemMessage')));
      }
      list.append(systemMessage);
      previousMessage = null;
      return;
    }
    const grouped = messagesBelongTogether(previousMessage, message);
    list.append(buildMessageRow(message, grouped));
    previousMessage = message;
  });
  if (forceBottom || wasNearBottom) list.scrollTop = list.scrollHeight;
}

// SIFIR MIMARI (yerel-öncelikli gonderim): Mesaj anında YEREL çizilir
// (0 sunucu isteği, 0 bloklayan round-trip), 5 sn cooldown başlar ve mesaj
// arka planda (asenkron, bloklayıcı olmayan) outbox üzerinden sunucuya
// iletilir. Gönderim anında, teslim arka planda yapılır.
async function sendCurrentMessage(event) {
  event.preventDefault();
  if (!state.currentRoom) return;
  const textarea = $('#message-input');
  const message = textarea.value.trim();
  const image = state.pendingImage;
  if (!message && !image) {
    toast('Mesaj veya resim ekleyin.', 'warning');
    return;
  }
  const form = event.currentTarget;
  const submit = $('button[type="submit"]', form);
  // 5 sn cooldown: bir gönderimden sonra buton 5 sn kilitli (geri sayımlı),
  // süre bitmeden yazılsa bile gönderilemez. Kilit zaman damgasından okunur.
  if (sendCooldownRemainingSeconds() > 0) return;
  const localId = 'local-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
  const sentMsg = {
    id: localId,
    user_id: Number(state.user?.id || 0),
    username: state.user?.username || '',
    avatar_color: state.user?.avatar_color || 'c1',
    profile_image_path: state.user?.profile_image_path || null,
    active_profile_frame: state.user?.active_profile_frame || null,
    type: image ? 'image' : 'text',
    content: message,
    image_path: null, // sunucu tesliminden sonra doldurulur
    created_at: new Date().toISOString(),
    view_count: 0,
    is_own: true,
  };
  // Yerel: anında çiz (0 sunucu isteği) + onbelleğe ekle + textarea'yı temizle.
  const list = $('#message-list');
  if (list) {
    const row = renderLocalRow(sentMsg);
    row.dataset.localId = String(localId);
    list.append(row);
    list.scrollTop = list.scrollHeight;
  }
  msgCacheAppend(state.currentRoom.id, sentMsg);
  // Boş odaya yazılan ilk mesaj: sunucu meta=1 olmadan geri sayım
  // göndermediği için sayaç buradan başlatılır (ek istek yok).
  if (!state.nextCleanupAt) {
    state.retentionLoading = false;
    state.nextCleanupAt = new Date(Date.now() + retentionHoursValue() * 3600000).toISOString();
    updateRetentionCountdown();
    startRetentionCountdownTimer();
  }
  textarea.value = '';
  textarea.classList.remove('expanded');
  if (image) releasePendingImage();
  // Outbox'a ekle (dosya referansını görsel mesajlar için tut) + 5 sn cooldown.
  state.sendOutbox.push({ localId: localId, room_id: state.currentRoom.id, content: message, image: image || null, user: sentMsg });
  persistSendOutbox();
  startSendCooldown(submit);
  // Arka plan outbox senkronizasyonu (asenkron, bloklayıcı değil).
  syncSendOutbox();
}

// 5 sn gönderim cooldown'u: buton üzerinde 5..4..3..2..1 geri sayımı,
// süre bitmeden gönderim kilitli, süre bitince tekrar gönderilebilir.
// Kalan cooldown saniyesi TEK kaynaktan (zaman damgası) okunur.
function sendCooldownRemainingSeconds() {
  const remaining = Math.ceil((Number(state.sendCooldownUntil) - Date.now()) / 1000);
  return Number.isFinite(remaining) && remaining > 0 ? remaining : 0;
}

/**
 * Gönderim kilidini VERİLEN butona uygular; süre bittiyse kilidi söker.
 *
 * Kilit eskiden gönderim anındaki buton düğümüne kapanışla bağlıydı ve
 * clearTimers() bu zamanlayıcıyı tanımıyordu. Kullanıcı 5 sn dolmadan başka
 * odaya geçince eski sayaç kopmuş bir düğüm üzerinde saymayı sürdürüyor, yeni
 * odanın butonu SERBEST görünürken gönderimler sessizce yutuluyordu. Artık
 * kilit bir zaman damgasıdır ve her composer çiziminde yeni butona yeniden
 * uygulanır; guard da bayraktan değil damgadan okur (bayat bayrak gönderimi
 * ne yanlışlıkla kilitler ne yanlışlıkla açar).
 */
function applySendCooldownToButton(submit) {
  const remaining = sendCooldownRemainingSeconds();
  if (!remaining) {
    if (state.sendCooldownTimer) {
      window.clearInterval(state.sendCooldownTimer);
      state.sendCooldownTimer = null;
    }
    state.sendCooldownActive = false;
    if (submit) {
      submit.disabled = false;
      submit.replaceChildren(svgIcon('send'));
    }
    return;
  }
  state.sendCooldownActive = true;
  if (!submit) return;
  submit.disabled = true;
  submit.textContent = String(remaining);
}

// Cooldown sürerken her saniye CANLI butonu bulup tazeler; kilit composer
// yeniden çizilse bile kopmaz.
function ensureSendCooldownTicker() {
  if (!sendCooldownRemainingSeconds()) {
    applySendCooldownToButton(null);
    return;
  }
  if (state.sendCooldownTimer) return;
  state.sendCooldownTimer = window.setInterval(() => {
    applySendCooldownToButton($('#composer-form button[type="submit"]'));
  }, 1000);
}

function startSendCooldown(submit) {
  state.sendCooldownUntil = Date.now() + SEND_COOLDOWN_MS;
  if (state.sendCooldownTimer) {
    window.clearInterval(state.sendCooldownTimer);
    state.sendCooldownTimer = null;
  }
  applySendCooldownToButton(submit);
  ensureSendCooldownTicker();
}

// Gönderim outbox'ı: yerel çizilen mesajlar burada bekletilir, arka planda
// (asenkron, bloklayıcı değil) sunucuya iletilir. Dosyalar localStorage'a
// yazılamaz; görsel girdiler yalnızca bellekte tutulur, sayfa kapanırsa
// görsel gidişleri (yalnız metni) onbellekte kalır.
function persistSendOutbox() {
  try {
    const serializable = state.sendOutbox.map((e) => ({ localId: e.localId, room_id: e.room_id, content: e.content, image: null, user: e.user }));
    localStorage.setItem(SEND_OUTBOX_KEY, JSON.stringify(serializable));
  } catch (_) {}
}

function loadSendOutbox() {
  try {
    const raw = localStorage.getItem(SEND_OUTBOX_KEY);
    if (!raw) { state.sendOutbox = []; return; }
    const arr = JSON.parse(raw);
    state.sendOutbox = Array.isArray(arr) ? arr : [];
  } catch (_) { state.sendOutbox = []; }
}

let sendOutboxSyncing = false;
function syncSendOutbox() {
  if (sendOutboxSyncing || !state.sendOutbox.length) return;
  sendOutboxSyncing = true;
  (async () => {
    try {
      const batch = state.sendOutbox.splice(0, state.sendOutbox.length);
      for (const entry of batch) {
        try {
          const data = new FormData();
          data.append('room_id', String(entry.room_id));
          data.append('message', entry.content);
          if (entry.image) data.append('image', entry.image, entry.image.name);
          const payload = await api('send_message', { method: 'POST', formData: data, background: true });
          const serverId = Number(payload?.message_id || 0);
          if (serverId) reconcileLocalMessage(entry.localId, entry.room_id, { id: serverId, image_path: payload?.image_path || null }, entry.user);
          persistSendOutbox();
          // Sohbet başladı: nabız izleyicisi kısa süre 10 sn'de bir yoklar,
          // böylece karşı tarafın yanıtı hızlı görünür. Pencere kapanınca
          // ritim kendiliğinden 60 sn'ye döner (boşta maliyet değişmez).
          notifyRoomActivity();
        } catch (_) {
          // Teslim başarısız: başa koy, geri çekilerek dene.
          state.sendOutbox.unshift(entry);
          persistSendOutbox();
          toast(t('sendRetry'), 'warning');
          if (state.sendOutbox.length) window.setTimeout(syncSendOutbox, 4000);
          break;
        }
      }
    } finally {
      sendOutboxSyncing = false;
    }
  })();
}

// Yerel çizilen mesajın geçici id'sini sunucu id'siyle değiştir.
// SIFIR İSTEK: onbellek ve satır YERİNDE güncellenir; liste yeniden
// çekilmez (fetchMessages yok). Sonraki yoklamada resmî satır yerel
// satırla aynı id'yi taşır; imza değişmediği için çift çizim olmaz.
function reconcileLocalMessage(localId, roomId, updates, msg) {
  const serverId = Number(updates?.id || 0);
  roomId = Number(roomId || 0);
  try {
    const raw = localStorage.getItem(msgCacheKey(roomId));
    if (raw) {
      const arr = JSON.parse(raw) || [];
      const idx = arr.findIndex((m) => String(m.id) === String(localId));
      if (idx >= 0) {
        arr[idx] = Object.assign({}, arr[idx], updates);
        localStorage.setItem(msgCacheKey(roomId), JSON.stringify(arr));
      }
    }
  } catch (_) {}
  if (serverId) {
    // Yerel -> sunucu id eslemesi: sonraki islemler (ornek silme, gorenlere)
    // resmi id'yi kullanir. 200 kaydin ustunde eskileri at.
    if (!state.localIdMap) state.localIdMap = {};
    state.localIdMap[localId] = serverId;
    const keys = Object.keys(state.localIdMap);
    if (keys.length > 200) {
      keys.slice(0, keys.length - 200).forEach((k) => delete state.localIdMap[k]);
    }
    const list = $('#message-list');
    const row = list && list.querySelector(`[data-local-id="${CSS.escape(String(localId))}"]`);
    if (row) {
      row.dataset.localId = String(serverId);
      row.dataset.msgId = String(serverId);
      // Görsel mesaj: teslim sonrası resmi resim satıra yerinde eklenir
      // (ilk çizimde dosya henüz sunucuda yoktu).
      const imagePath = updates?.image_path || null;
      if (imagePath && isSafeImagePath(imagePath) && !row.querySelector('img.message-image')) {
        const bubble = row.querySelector('.message-bubble');
        if (bubble) {
          const image = document.createElement('img');
          image.className = 'message-image';
          image.src = imageSource(imagePath);
          image.alt = (row.querySelector('.message-text') || {}).textContent || t('sharedImage');
          image.loading = 'lazy';
          image.decoding = 'async';
          image.draggable = false;
          const meta = bubble.querySelector('.message-meta');
          bubble.insertBefore(image, meta || null);
        }
      }
    }
  }
}

function handleImageSelection(event) {
  const file = event.target.files?.[0];
  event.target.value = '';
  if (!file) return;
  const allowed = ['image/jpeg', 'image/png', 'image/webp'];
  if (!allowed.includes(file.type)) {
    toast(t('photoType'), 'error');
    return;
  }
  if (file.size > MAX_IMAGE_BYTES) {
    toast('Resim en fazla 5 MB olabilir.', 'error');
    return;
  }
  releasePendingImage();
  state.pendingImage = file;
  state.previewUrl = URL.createObjectURL(file);
  const preview = $('#image-preview');
  if (!preview) return;
  $('img', preview).src = state.previewUrl;
  const previewLabel = $('span', preview);
  const sizeLabel = `${(file.size / 1024 / 1024).toFixed(2)} MB`;
  previewLabel.textContent = `${file.name} · ${sizeLabel}`;
  previewLabel.title = `${file.name} · ${sizeLabel}`;
  preview.hidden = false;
}

function releasePendingImage() {
  if (state.previewUrl) URL.revokeObjectURL(state.previewUrl);
  state.previewUrl = '';
  state.pendingImage = null;
  const preview = $('#image-preview');
  if (preview) preview.hidden = true;
}

function openAnnouncementAdminMenu(message) {
  if (state.adminActive) {
    openAnnouncementDeleteMenu(message);
    return;
  }
  const content = createElement('div');
  content.append(
    createElement('p', 'modal-copy', 'Topluluk duyurusu mesajını silmek veya yönetim işlemlerini uygulamak için admin şifresini girin.')
  );
  const form = createElement('form', 'auth-form');
  const password = document.createElement('input');
  password.type = 'password';
  password.required = true;
  password.autocomplete = 'current-password';
  password.placeholder = 'Admin şifresi';
  const actions = createElement('div', 'modal-actions');
  const cancel = button(t('cancel'), 'ghost-button');
  cancel.addEventListener('click', closeModal);
  actions.append(cancel, button('Doğrula', 'primary-button', 'submit'));
  form.append(password, actions);
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    try {
      await api('admin_login', { method: 'POST', data: { password: password.value }, loading: true });
      state.adminActive = true;
      openAnnouncementDeleteMenu(message);
    } catch (error) { displayError(error); }
  });
  content.append(form);
  openModal('Duyuru yönetimi', content, 'ADMİN DOĞRULAMASI');
  window.setTimeout(() => password.focus(), 0);
}

function openAnnouncementDeleteMenu(message) {
  const content = createElement('div');
  content.append(
    createElement('p', 'modal-copy', 'Bu duyuru, gönderildiği bütün odalardan ve veritabanından kalıcı olarak silinecektir.'),
    createElement('div', 'admin-critical-warning', 'Bu işlem geri alınamaz.')
  );
  const actions = createElement('div', 'modal-actions');
  const cancel = button(t('cancel'), 'ghost-button');
  cancel.addEventListener('click', closeModal);
  const remove = button('Duyuruyu Sil', 'danger-button');
  remove.addEventListener('click', async () => {
    try {
      await api('admin_delete_announcement', {
        method: 'POST',
        data: { message_id: message.id },
        loading: true
      });
      closeModal();
      state.messagesSignature = '';
      await fetchMessages(true);
      toast('Duyuru bütün odalardan silindi.');
    } catch (error) { displayError(error); }
  });
  actions.append(cancel, remove);
  content.append(actions);
  openModal('Duyuruyu sil', content, 'KALICI İŞLEM');
}

function openMessageRetentionReason() {

/**
 * Tam ekran görsel görüntüleyici: tekerlek, çift dokunuş ve iki parmakla
 * yakınlaştırma, sürükleyerek kaydırma, X veya ESC ile çıkış.
 */
function openImageZoom(source, description = t('sharedImageAlt')) {
  const overlay = createElement('div', 'image-zoom-overlay');
  overlay.setAttribute('role', 'dialog');
  overlay.setAttribute('aria-modal', 'true');
  overlay.setAttribute('aria-label', t('imageViewer'));
  const stage = createElement('div', 'image-zoom-stage');
  const image = document.createElement('img');
  image.className = 'image-zoom-image';
  image.src = source;
  image.alt = description;
  image.draggable = false;
  stage.append(image);

  let scale = 1;
  let offsetX = 0;
  let offsetY = 0;
  let dragging = false;
  let startX = 0;
  let startY = 0;
  let pinchDistance = 0;
  let pinchScale = 1;
  const pointers = new Map();

  const apply = () => { image.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`; };
  const setScale = (next) => {
    scale = Math.min(6, Math.max(1, Number(next.toFixed(3))));
    if (scale === 1) { offsetX = 0; offsetY = 0; }
    apply();
  };

  const close = () => {
    document.removeEventListener('keydown', onKeyDown);
    overlay.remove();
    if ($('#modal-backdrop').hidden) document.body.classList.remove('modal-open');
  };
  function onKeyDown(event) {
    if (event.key === 'Escape') { event.preventDefault(); close(); }
    if (event.key === '+' || event.key === '=') setScale(scale + 0.4);
    if (event.key === '-') setScale(scale - 0.4);
  }

  const closeButton = createElement('button', 'image-zoom-close', '✕');
  closeButton.type = 'button';
  closeButton.setAttribute('aria-label', t('closeImage'));
  closeButton.addEventListener('click', close);

  const controls = createElement('div', 'image-zoom-controls');
  const zoomOut = button('−', '');
  zoomOut.setAttribute('aria-label', t('zoomOut'));
  zoomOut.addEventListener('click', () => setScale(scale - 0.4));
  const reset = button(t('zoomFit'), '');
  reset.addEventListener('click', () => setScale(1));
  const zoomIn = button('+', '');
  zoomIn.setAttribute('aria-label', t('zoomIn'));
  zoomIn.addEventListener('click', () => setScale(scale + 0.4));
  controls.append(zoomOut, reset, zoomIn);

  stage.addEventListener('wheel', (event) => {
    event.preventDefault();
    setScale(scale + (event.deltaY < 0 ? 0.28 : -0.28));
  }, { passive: false });
  stage.addEventListener('dblclick', (event) => {
    event.preventDefault();
    setScale(scale > 1.05 ? 1 : 2.4);
  });
  stage.addEventListener('pointerdown', (event) => {
    pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      pinchDistance = Math.hypot(a.x - b.x, a.y - b.y) || 1;
      pinchScale = scale;
      dragging = false;
      return;
    }
    if (event.target !== image) return;
    dragging = true;
    startX = event.clientX - offsetX;
    startY = event.clientY - offsetY;
    stage.classList.add('dragging');
    if (stage.setPointerCapture) stage.setPointerCapture(event.pointerId);
  });
  stage.addEventListener('pointermove', (event) => {
    if (pointers.has(event.pointerId)) pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      const distance = Math.hypot(a.x - b.x, a.y - b.y) || 1;
      setScale(pinchScale * (distance / pinchDistance));
      return;
    }
    if (!dragging || scale <= 1) return;
    offsetX = event.clientX - startX;
    offsetY = event.clientY - startY;
    apply();
  });
  const endPointer = (event) => {
    pointers.delete(event.pointerId);
    if (pointers.size < 2) pinchDistance = 0;
    dragging = false;
    stage.classList.remove('dragging');
  };
  stage.addEventListener('pointerup', endPointer);
  stage.addEventListener('pointercancel', endPointer);
  stage.addEventListener('pointerleave', endPointer);
  overlay.addEventListener('click', (event) => { if (event.target === overlay || event.target === stage) close(); });
  image.addEventListener('error', () => {
    stage.replaceChildren(createElement('p', 'image-zoom-hint', t('imageFail')));
  });

  overlay.append(stage, closeButton, controls, createElement('p', 'image-zoom-hint', t('zoomHint')));
  document.body.append(overlay);
  document.body.classList.add('modal-open');
  document.addEventListener('keydown', onKeyDown);
  apply();
  closeButton.focus();
  return overlay;
}

function showUndoDeleteToast(payload) {
  const item = createElement('div', 'toast warning undo-delete-toast');
  item.setAttribute('role', 'status');
  const copy = createElement('div', 'undo-delete-copy');
  copy.append(createElement('strong', '', t('deletingTitle')), createElement('span', '', t('deleting')));
  const undo = button('Geri al', 'undo-delete-button');
  const progress = createElement('span', 'undo-delete-progress');
  item.append(copy, undo, progress);
  makeToastDismissible(item);
  $('#toast-region').append(item);
  let settled = false;
  const delay = Math.max(0, new Date(payload.undo_until).getTime() - Date.now());
  const finalizeTimer = window.setTimeout(async () => {
    if (settled) return;
    settled = true;
    undo.disabled = true;
    try {
      await api('finalize_message_delete', { method: 'POST', data: { message_id: payload.message_id } });
    } catch (error) {
      if (error.code !== 'DELETE_COOLDOWN_ACTIVE' && error.code !== 'MESSAGE_NOT_FOUND') displayError(error);
    }
    delete state.undoBuffer[payload.message_id];
    item.remove();
  }, delay + 120);
  undo.addEventListener('click', async () => {
    if (settled) return;
    settled = true;
    window.clearTimeout(finalizeTimer);
    undo.disabled = true;
    try {
      await api('undo_delete_message', {
        method: 'POST',
        data: { message_id: payload.message_id, undo_token: payload.undo_token }
      });
      item.remove();
      // Yerel geri cizim (0 ek istek): onbellekten dogru sirayla yeniden cizilir
      restoreDeletedLocally(payload.message_id);
      toast(t('messageRestored'));
    } catch (error) {
      item.remove();
      displayError(error);
    }
  });
}

async function deleteMessage(messageId) {
  const idStr = String(messageId);
  // Yerel (henüz sunucuya teslim edilmemiş / edilmiş) mesaj:
  if (idStr.startsWith('local-')) {
    closeModal();
    // 1) Outbox'ta hâlâ bekliyorsa: teslimi iptal et (sunucuya hiç gitmedi)
    const outboxIdx = state.sendOutbox.findIndex((e) => e.localId === idStr);
    if (outboxIdx >= 0) {
      state.sendOutbox.splice(outboxIdx, 1);
      persistSendOutbox();
      removeLocalMessageRows(idStr);
      toast(t('messageDeleted'), 'warning');
      return;
    }
    // 2) Teslim edilmişse: sunucu id'si üzerinden normal akış (undo dahil)
    const serverId = Number((state.localIdMap || {})[idStr] || 0);
    if (serverId) { deleteMessage(serverId); return; }
    // 3) Ne outbox'ta ne haritada (teslim edildiyse haritada olmalı; emniyet)
    removeLocalMessageRows(idStr);
    toast(t('messageDeleted'), 'warning');
    return;
  }
  try {
    const result = await api('delete_message', { method: 'POST', data: { message_id: messageId } });
    closeModal();
    // SIFIR EK ISTEK: satir + onbellek yerinde guncellenir, liste yeniden
    // cekilmez (eski akistaki tam refetch gereksiz ek hit yiyordu).
    removeDeletedLocally(Number(messageId));
    showUndoDeleteToast(result);
  } catch (error) { displayError(error); }
}

// Silinen mesaj ekrandan + onbellekten yerinde kaldirilir (0 istek).
// Undo penceresi boyunca hafizada tutulur (undoBuffer).
function removeDeletedLocally(serverId) {
  const roomId = Number(state.currentRoom?.id || 0);
  // Undo kopyasi: onbellegin resmi kaydi (yoksa DOM'dan kurtar)
  let entry = null;
  try {
    const raw = localStorage.getItem(msgCacheKey(roomId));
    if (raw) {
      const arr = JSON.parse(raw) || [];
      entry = arr.find((m) => Number(m.id) === serverId) || null;
    }
  } catch (_) {}
  if (!entry) {
    const list = $('#message-list');
    const row = list && list.querySelector(`[data-msg-id="${CSS.escape(String(serverId))}"]`);
    const txt = row && (row.querySelector('.message-text') || { textContent: '' }).textContent;
    entry = {
      id: serverId, user_id: Number(state.user?.id || 0), username: state.user?.username || '',
      avatar_color: state.user?.avatar_color || 'c1', profile_image_path: null, active_profile_frame: null,
      type: 'text', content: txt || '', image_path: null,
      created_at: row ? (row.querySelector('time') || { textContent: '' }).textContent : new Date().toISOString(),
      view_count: 0,
    };
  }
  if (entry) state.undoBuffer[serverId] = entry;
  // DOM
  const list = $('#message-list');
  if (list) {
    const row = list.querySelector(`[data-msg-id="${CSS.escape(String(serverId))}"]`) ||
      list.querySelector(`[data-local-id="${CSS.escape(String(serverId))}"]`);
    if (row) row.remove();
  }
  // Onbellek
  if (roomId) {
    try {
      const raw = localStorage.getItem(msgCacheKey(roomId));
      if (raw) {
        const arr = (JSON.parse(raw) || []).filter((m) => Number(m.id) !== serverId);
        localStorage.setItem(msgCacheKey(roomId), JSON.stringify(arr));
      }
    } catch (_) {}
  }
  if (state.localIdMap) {
    const keys = Object.keys(state.localIdMap).filter((k) => Number(state.localIdMap[k]) === serverId);
    keys.forEach((k) => delete state.localIdMap[k]);
  }
}

// Geri al: sunucu 1 istegi + yerel yeniden cizim (ek istek YOK)
function restoreDeletedLocally(serverId) {
  const roomId = Number(state.currentRoom?.id || 0);
  const entry = state.undoBuffer[serverId];
  delete state.undoBuffer[serverId];
  if (!roomId || !entry) {
    // Emniyet: yerel kopya yoksa (ornek sayfa yenilendi) tek kurtarma cekimi
    if (state.route === 'room' && state.currentRoom) fetchMessages(false).catch(() => {});
    return;
  }
  entry.is_own = Number(entry.user_id) === Number(state.user?.id || 0);
  // Onbellegi geri ekle + ID sirasinda tut
  try {
    const raw = localStorage.getItem(msgCacheKey(roomId));
    const arr = raw ? (JSON.parse(raw) || []) : [];
    if (!arr.some((m) => Number(m.id) === Number(entry.id))) arr.push(Object.assign({}, entry));
    arr.sort((a, b) => Number(a.id) - Number(b.id));
    localStorage.setItem(msgCacheKey(roomId), JSON.stringify(arr.slice(-MSG_CACHE_MAX)));
  } catch (_) {}
  // Guncel odadaysa: onbellegeden (0 istek) dogru sirayla yeniden ciz
  if (Number(state.currentRoom?.id || 0) === roomId && state.route === 'room') {
    const cached = msgCacheGet(roomId);
    if (cached && cached.length) {
      state.messagesSignature = '';
      renderMessages(cached);
    } else {
      const list = $('#message-list');
      if (list && !list.querySelector(`[data-msg-id="${CSS.escape(String(serverId))}"]`)) {
        list.append(buildMessageRow(entry, false));
      }
    }
  }
}

// Yerel satiri ekrandan + onbellekten kaldirir (sunucu istegi ATMAZ)
function removeLocalMessageRows(localId) {
  const serverId = Number((state.localIdMap || {})[localId] || 0);
  const list = $('#message-list');
  if (list) {
    const row = list.querySelector(`[data-local-id="${CSS.escape(localId)}"]`) ||
      (serverId ? list.querySelector(`[data-local-id="${CSS.escape(String(serverId))}"]`) : null);
    if (row) row.remove();
  }
  const roomId = Number(state.currentRoom?.id || 0);
  if (roomId) {
    try {
      const raw = localStorage.getItem(msgCacheKey(roomId));
      if (raw) {
        const arr = (JSON.parse(raw) || []).filter((m) => String(m.id) !== localId && Number(m.id) !== serverId);
        localStorage.setItem(msgCacheKey(roomId), JSON.stringify(arr));
      }
    } catch (_) {}
  }
}

function createProfilePhotoControl(profile) {
  const wrapper = createElement('div', 'profile-photo-control');
  const changeButton = createElement('button', 'profile-photo-button');
  changeButton.type = 'button';
  changeButton.title = t('photoAdd');
  changeButton.setAttribute('aria-label', t('photoAdd'));
  changeButton.append(avatar(profile.username, profile.avatar_color, true, profile.profile_image_path, profile.active_profile_frame));
  const overlay = createElement('span', 'profile-photo-overlay');
  overlay.append(svgIcon('image'));
  changeButton.append(overlay);
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/jpeg,image/png,image/webp';
  input.className = 'visually-hidden';
  changeButton.addEventListener('click', () => input.click());
  input.addEventListener('change', async () => {
    const file = input.files?.[0];
    input.value = '';
    if (!file) return;
    if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) {
      toast(t('photoType'), 'error');
      return;
    }
    if (file.size > MAX_IMAGE_BYTES) {
      toast(t('photoSize'), 'error');
      return;
    }
    const data = new FormData();
    data.append('image', file, file.name);
    try {
      const result = await api('update_profile_photo', { method: 'POST', formData: data, loading: true });
      state.user.profile_image_path = result.profile_image_path;
      toast(t('photoUpdated'));
      await renderProfile(state.user.id);
    } catch (error) { displayError(error); }
  });
  wrapper.append(changeButton, input);
  if (isSafeImagePath(profile.profile_image_path)) {
    const remove = button(t('photoRemove'), 'profile-photo-remove');
    remove.addEventListener('click', async () => {
      try {
        await api('delete_profile_photo', { method: 'POST', data: {}, loading: true });
        state.user.profile_image_path = null;
        toast(t('photoRemoved'));
        await renderProfile(state.user.id);
      } catch (error) { displayError(error); }
    });
    wrapper.append(remove);
  }
  return wrapper;
}

function scheduleApprovalStatusCheck(delay = 20000) {
  if (state.approvalTimer) window.clearTimeout(state.approvalTimer);
  state.approvalTimer = window.setTimeout(async () => {
    state.approvalTimer = null;
    if (state.route !== 'approval') return;
    try {
      const payload = await api('session', { background: true, noDedupe: true });
      if (payload.csrf_token) state.csrf = payload.csrf_token;
      if (payload.authenticated) {
        mergeUserFromPayload(payload.user);
        showApp();
        await loadRooms(false);
        return;
      }
      if (!payload.approval_required) {
        state.deviceBound = Boolean(payload.device_has_account);
        state.boundUsername = payload.bound_username || '';
        handleApprovalBlock(payload.approval_block);
        showAuth();
        return;
      }
    } catch (_) {
      // Geçici hosting/ağ hatası başvuru ekranını bozmaz; sonraki turda yeniden denenir.
    }
    if (state.route === 'approval') scheduleApprovalStatusCheck(30000);
  }, delay);
}

function openMiniGame(gameId, title) {
  const content = createElement('div');
  const canvas = document.createElement('canvas');
  canvas.width = 420; canvas.height = 260; canvas.className = 'game-canvas';
  const hud = createElement('div', 'game-hud');
  const scoreText = createElement('strong', '', 'Skor: 0/5');
  const timeText = createElement('span', '', 'Süre: 20');
  hud.append(scoreText, timeText);
  const info = createElement('p', 'modal-copy', 'Parlayan hedefe 5 kez tıkla. 20 saniye içinde başarırsan 0.1 AA Coin kazanırsın.');
  const start = button('Başlat', 'primary-button');
  content.append(info, canvas, hud, start);
  openModal(title, content, 'OYUN', true);
  const ctx = canvas.getContext('2d');
  let score = 0, running = false, deadline = 0, target = { x: 80, y: 80, r: 22 };
  const colors = { sky_dash: '#7d8cff', lane_rush: '#f2b84b', snake_bite: '#43c98d' };
  const moveTarget = () => { target = { x: 35 + Math.random() * 350, y: 35 + Math.random() * 190, r: 20 + Math.random() * 10 }; };
  const draw = () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#080a10'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = 'rgba(255,255,255,.08)';
    for (let x = 0; x < canvas.width; x += 32) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke(); }
    ctx.fillStyle = colors[gameId] || '#7d8cff';
    ctx.beginPath(); ctx.arc(target.x, target.y, target.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '20px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(gameId === 'lane_rush' ? '🏎️' : gameId === 'snake_bite' ? '🐍' : '✦', target.x, target.y);
  };
  const finish = async (won) => {
    running = false;
    start.disabled = false;
    start.textContent = won ? 'Tekrar Oyna' : 'Yeniden Dene';
    if (!won) { toast('Oyun bitti. Tekrar dene.', 'warning'); return; }
    try {
      const result = await api('claim_game_reward', { method: 'POST', data: { game_id: gameId, score }, loading: true });
      mergeUserFromPayload(result.user);
      toast(localizeServerMessage(result.message));
    } catch (error) { displayError(error); }
  };
  const tick = () => {
    if (!running) return;
    const remain = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
    timeText.textContent = `Süre: ${remain}`;
    draw();
    if (remain <= 0) finish(false);
    else requestAnimationFrame(tick);
  };
  canvas.addEventListener('click', (event) => {
    if (!running) return;
    const rect = canvas.getBoundingClientRect();
    const x = (event.clientX - rect.left) * (canvas.width / rect.width);
    const y = (event.clientY - rect.top) * (canvas.height / rect.height);
    if (Math.hypot(x - target.x, y - target.y) <= target.r + 4) {
      score += 1;
      scoreText.textContent = `Skor: ${score}/5`;
      if (score >= 5) finish(true);
      else moveTarget();
    }
  });
  start.addEventListener('click', () => {
    score = 0; running = true; deadline = Date.now() + 20000; start.disabled = true; scoreText.textContent = 'Skor: 0/5'; moveTarget(); tick();
  });
  draw();
}

// Yeni şifre, sunucudaki validatePassword() ile BİREBİR aynı kurallardan
// geçer. Kural burada da denetlenir ki kullanıcı hatayı istek gitmeden görsün;
// son söz her zaman sunucunundur.
function passwordRuleError(current, password, confirmation) {
  if (!current) return t('ruleCurrentRequired');
  if (password !== confirmation) return t('ruleMismatch');
  if (password.length < 10 || password.length > 128) return t('ruleLength');
  if (/\s/.test(password)) return t('ruleNoSpace');
  if (!/\p{L}/u.test(password) || !/\p{N}/u.test(password) || !/[^\p{L}\p{N}]/u.test(password)) {
    return t('ruleCharset');
  }
  if (password === current) return t('ruleSame');
  return null;
}

// Giriş/kayıt ekranlarındaki yapının aynısı: etiket, .password-field sarmalı
// ve Göster/Gizle düğmesi. Düğme etiketin İÇİNE konmaz; aksi halde etiketin
// varsayılan davranışı her tıklamada odağı şifre alanına çeker.
function passwordFieldWithToggle(id, name, labelText, autocomplete, options = {}) {
  const label = document.createElement('label');
  label.htmlFor = id;
  label.textContent = labelText;
  const wrapper = createElement('div', 'password-field');
  const input = document.createElement('input');
  input.id = id;
  input.name = name;
  input.type = 'password';
  input.required = true;
  input.maxLength = 128;
  input.autocomplete = autocomplete;
  // minlength yalnızca YENİ şifreye uygulanır: güncel şifre, kural
  // sıkılaşmadan önce açılmış bir hesabın şifresi olabilir ve kısa diye
  // reddedilirse kullanıcı kendi hesabına bir daha erişemez.
  if (options.enforceRules) input.minLength = 10;
  const toggle = button(t('show'), 'icon-text-button password-toggle');
  toggle.setAttribute('aria-label', labelText);
  toggle.addEventListener('click', () => {
    const reveal = input.type === 'password';
    input.type = reveal ? 'text' : 'password';
    toggle.textContent = reveal ? t('hide') : t('show');
  });
  wrapper.append(input, toggle);
  const parts = [label, wrapper];
  if (options.note) parts.push(createElement('p', 'field-note', options.note));
  return { parts, input };
}

function openChangePassword() {
  const content = createElement('div');
  content.append(createElement('p', 'modal-copy', t('changePasswordCopy')));
  const form = createElement('form', 'auth-form');
  const current = passwordFieldWithToggle('change-password-current', 'current_password', t('currentPassword'), 'current-password');
  const next = passwordFieldWithToggle('change-password-new', 'password', t('newPassword'), 'new-password', { enforceRules: true });
  const confirm = passwordFieldWithToggle('change-password-confirm', 'password_confirm', t('newPasswordConfirm'), 'new-password', {
    enforceRules: true,
    note: t('passwordRules')
  });
  // Hata, formun içinde gösterilir: toast 6 sn'de kaybolur ama kullanıcı
  // hangi kurala takıldığını okuyup alanı düzeltmek zorundadır.
  const notice = createElement('p', 'field-note danger-text');
  notice.hidden = true;
  const actions = createElement('div', 'modal-actions');
  const cancel = button(t('cancel'), 'ghost-button');
  cancel.addEventListener('click', closeModal);
  const submit = button(t('save'), 'primary-button', 'submit');
  actions.append(cancel, submit);
  form.append(...current.parts, ...next.parts, ...confirm.parts, notice, actions);
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const data = Object.fromEntries(new FormData(form));
    const problem = passwordRuleError(data.current_password, data.password, data.password_confirm);
    if (problem) {
      notice.textContent = problem;
      notice.hidden = false;
      // İstek atılmadı, dolayısıyla korunacak bir şey de yok: kilit geri
      // alınır ki kullanıcı alanı düzeltir düzeltmez tekrar gönderebilsin.
      releaseActionLock(form, submit);
      return;
    }
    notice.hidden = true;
    try {
      const payload = await api('change_password', { method: 'POST', data, loading: true });
      closeModal();
      toast(localizeServerMessage(payload.message) || t('passwordChanged'));
    } catch (error) {
      notice.textContent = localizeServerMessage(error instanceof Error ? error.message : String(error));
      notice.hidden = false;
      // İstek tamamlandı (ayakta istek yok); tekrar denemenin önü açılır.
      releaseActionLock(form, submit);
    }
  });
  content.append(form);
  openModal(t('changePassword'), content, t('security'));
}

function renderPendingApprovals(container) {
  container.replaceChildren(createElement('h2', '', 'Onaylanmayı Bekleyenler'), createElement('p', 'panel-description', 'Başvuruları kabul edebilir veya reddedebilirsin. 15 gün yanıtlanmayan başvurular sistem tarafından kapatılır.'));

  // Araç çubuğu: moderatör listeyi istediği an tazeler ve kaç hesabın
  // beklediğini SAYIYLA görür. Sekme açıkken yeni kayıt düşerse liste
  // kendiliğinden tazelenmez; bu düğme o boşluğu kapatır.
  const toolbar = createElement('div', 'approval-toolbar');
  const refresh = button('Herkesi Gör / Yenile', 'secondary-button');
  refresh.type = 'button';
  // KÖK NEDEN DÜZELTMESİ: installGentleActionGuard() .secondary-button
  // tıklamalarını 3 sn boyunca kilitler ve bu aradaki tıklamaları
  // stopImmediatePropagation ile SESSİZCE yutar. Çift gönderim riski olmayan
  // salt-okunur bir yenileme için bu kilit, "düğmeye bastım ama bekleyenler
  // çıkmadı" şikâyetinin istemci tarafındaki asıl nedeniydi. Guard'ın kendi
  // kaçış anahtarı (data-no-action-lock) kullanılır; yine de aynı anda tek
  // istek uçuşta kalır, fazlası sıraya alınır (aşağıdaki loading/queued).
  refresh.setAttribute('data-no-action-lock', '');
  const status = createElement('p', 'approval-status');
  toolbar.append(refresh, status);
  // Eski auth uyarısı: nedeni yazılmamış bekleyenler eski sunucu sorgusunda
  // gizlenirdi. Sessiz boş liste yerine moderatöre NE yapacağını söyleriz.
  const warn = createElement('div', 'approval-warn');
  warn.hidden = true;
  const list = createElement('div', 'admin-user-list');
  list.append(createElement('p', 'panel-description', 'Başvurular yükleniyor…'));
  container.append(toolbar, warn, list);

  const REFRESH_LABEL = 'Herkesi Gör / Yenile';
  let loadGeneration = 0;
  let loading = false; // uçuşta bir yükleme var mı
  let queued = false;  // meşgulken gelen tıklama sıraya alındı mı
  const deciding = new Set();
  const load = async () => {
    const generation = ++loadGeneration;
    loading = true;
    refresh.textContent = 'Yenileniyor…';
    try {
      status.textContent = 'Liste yenileniyor…';
      const payload = await api('admin_pending_approvals', { noDedupe: true, priority: true });
      if (generation !== loadGeneration || state.route !== 'admin' || state.adminTab !== 'approvals') return;
      const items = Array.isArray(payload.pending) ? payload.pending : [];
      const modern = payload.includes_unsubmitted === true;
      warn.hidden = modern;
      if (!modern) {
        warn.replaceChildren(
          createElement('strong', '', 'Sunucudaki auth.php bu sürümden eski.'),
          createElement('span', '', ` Nedeni henüz yazılmamış bekleyen hesaplar eski sorguda gizlenir. asra-yukleme paketindeki auth.php dosyasını sunucuya yükleyip bu sekmeyi yenileyin. Sunucudaki sürüm: ${String(payload.build || 'bilinmiyor (v30 ve öncesi)')}.`)
        );
      }
      const written = items.filter((item) => item.submitted_at).length;
      status.textContent = `${items.length} bekleyen hesap · ${written} nedeni yazılmış · ${items.length - written} nedeni henüz yazılmamış · son yenileme ${new Date().toLocaleTimeString(currentLanguage(), { hour: '2-digit', minute: '2-digit' })}`;
      list.dataset.refreshedAt = String(Date.now());
      list.replaceChildren();
      if (!items.length) {
        list.append(createElement('p', 'panel-description', modern ? 'Bekleyen başvuru yok.' : 'Liste güvenle okunamıyor: sunucu sürümü eski, yukarıdaki uyarıya bakın.'));
        return;
      }
      items.forEach((item) => {
        const row = createElement('div', 'admin-user-row');
        const copy = createElement('div', 'admin-user-copy');
        copy.append(createElement('strong', '', item.username), createElement('small', '', item.submitted_at ? `Gönderim: ${formatDateTime(item.submitted_at)}` : `Kayıt: ${formatDateTime(item.created_at)} · katılma nedeni henüz yazılmadı`));
        copy.append(createElement('div', 'admin-approval-reason', item.reason || 'Kullanıcı henüz katılma nedenini yazmadı.'));
        const actions = createElement('div', 'admin-user-actions');
        const accept = button('Kabul et', 'primary-button');
        const reject = button('Reddet', 'danger-button');
        const decide = async (decision) => {
          if (deciding.has(item.id)) return;
          deciding.add(item.id);
          accept.disabled = true;
          reject.disabled = true;
          try {
            const result = await api('admin_decide_approval', { method: 'POST', data: { user_id: item.id, decision }, loading: true });
            row.remove();
            toast(result.message || (decision === 'accept' ? 'Başvuru kabul edildi.' : 'Başvuru reddedildi.'));
            await load();
          } catch (error) {
            if (['APPROVAL_NOT_FOUND', 'APPROVAL_STATE_CHANGED', 'APPROVAL_BUSY', 'APPROVAL_ALREADY_ACCEPTED'].includes(error.code)) {
              await load();
            } else {
              displayError(error);
              accept.disabled = false;
              reject.disabled = false;
            }
          } finally {
            deciding.delete(item.id);
          }
        };
        accept.addEventListener('click', () => decide('accept'));
        reject.addEventListener('click', () => decide('reject'));
        actions.append(reject, accept);
        row.append(createElement('span', 'message-avatar avatar-c1', initialOf(item.username)), copy, actions);
        list.append(row);
      });
    } catch (error) {
      if (generation !== loadGeneration || state.route !== 'admin' || state.adminTab !== 'approvals') return;
      if (error.code === 'ADMIN_REQUIRED') { state.adminActive = false; openAdmin(); return; }
      status.textContent = 'Liste alınamadı: ' + (error && error.message ? error.message : 'bilinmeyen hata');
      displayError(error);
    } finally {
      if (generation === loadGeneration) {
        loading = false;
        refresh.textContent = REFRESH_LABEL;
        // Meşgulken gelen tıklama kaybolmaz: istek biter bitmez liste bir kez
        // daha tazelenir. Moderatör "bastım ama hiçbir şey olmadı" yaşamaz.
        if (queued) {
          queued = false;
          status.textContent = 'Sıradaki yenileme çalışıyor…';
          load();
        }
      }
    }
  };
  refresh.addEventListener('click', () => {
    if (loading) {
      queued = true;
      status.textContent = 'Yenileme sıraya alındı — mevcut istek biter bitmez liste tekrar tazeleniyor…';
      return;
    }
    load();
  });
  load();
}

function renderAdminUsers(container) {

  const searchForm = createElement('form', 'search-row');
  const search = document.createElement('input'); search.type = 'search'; search.name = 'query'; search.maxLength = 50; search.placeholder = t('search');
  const presetQuery = String(state.presetAdminQuery || ''); state.presetAdminQuery = '';
  if (presetQuery) search.value = presetQuery;
  searchForm.append(search, button('Ara', 'primary-button', 'submit'));
  const list = createElement('div', 'admin-user-list');
  list.append(createElement('p', 'panel-description', 'Kullanıcılar yükleniyor…'));
  container.append(searchForm, list);
  const load = async () => {
    try {
      const payload = await api('admin_search_users', { query: { query: search.value.trim() } });
      list.replaceChildren();
      if (!payload.users.length) { list.append(createElement('p', 'panel-description', 'Kullanıcı bulunamadı.')); return; }
      // Onay bekleyenler asla ban/hesap yönetiminde gösterilmez (backend zaten filtreler, burada da ek koruma)
      payload.users.filter((user) => (user.approval_status || 'approved') === 'approved').forEach((user) => list.append(adminUserRow(user, load)));
      if (!payload.users.filter((u) => (u.approval_status || 'approved') === 'approved').length && payload.users.length) {
        list.replaceChildren(createElement('p', 'panel-description', 'Onay bekleyen hesaplar bu listede gösterilmez. Onay için Bekleyenler sekmesini kullan.'));
      }
    } catch (error) {
      if (error.code === 'ADMIN_REQUIRED') { state.adminActive = false; openAdmin(); return; }

  };

function adminUserRow(user, reload) {

  // Onay bekleyen kullanıcı bu ekrana gelmemeli; gelirse uyarı rozeti ekle

    nameLine.append(document.createTextNode(' '), createElement('span', 'badge warning', 'ONAY BEKLİYOR'));
  }
  if (user.is_banned) {
    const banText = user.permanent ? 'Kalıcı ban' : `Süreli ban · ${formatDateTime(user.banned_until)}`;
    nameLine.append(document.createTextNode(' '), createElement('span', 'badge danger', banText));
  }
  copy.append(
    nameLine,
    createElement('small', '', user.is_banned ? `Neden: ${user.ban_reason}` : `Katılım: ${formatDate(user.created_at, { dateStyle: 'medium' })} · Coin: ${formatCoin(user.aa_coins || 0)}${Number(user.aa_coins || 0) < 0 ? ' · Borçlu' : ''}`)
  );
  if (user.is_self) nameLine.append(document.createTextNode(' '), createElement('span', 'badge', 'Bu hesap'));

  if (user.is_banned) {
    const unban = button('Banını kaldır', 'secondary-button');
    unban.addEventListener('click', async () => {
      try {
        await api('admin_unban_user', { method: 'POST', data: { user_id: user.id }, loading: true });
        toast('Kullanıcının banı kaldırıldı.');
        reload();
      } catch (error) { displayError(error); }
    });
    actions.append(unban);
  } else {
    const ban = button('Banla', 'danger-button');
    ban.addEventListener('click', () => openBanMenu(user, reload));
    actions.append(ban);
  }
  const coin = button('Coin', 'secondary-button');
  coin.addEventListener('click', () => openAdminCoinMenu(user, reload));
  const debt = button('Borç', 'danger-button');
  debt.addEventListener('click', () => openAdminCoinAmount(user, reload, 'debt'));
  const changePassword = button('Şifre Değiştir', 'secondary-button admin-password-button');
  changePassword.addEventListener('click', () => openAdminChangePassword(user, reload));
  const remove = button('Hesabı Sil', 'danger-button admin-delete-button');
  remove.addEventListener('click', () => openAdminDeleteUser(user, reload));
  const profile = button('Profili Aç', 'secondary-button');
  profile.addEventListener('click', () => { closeModal(); renderProfile(user.id).catch(displayError); });
  actions.append(profile, coin, debt, changePassword, remove);
  const identity = avatar(user.username, user.avatar_color, false, user.profile_image_path, user.active_profile_frame);
  identity.setAttribute('role', 'button');
  identity.tabIndex = 0;
  identity.title = `${user.username} profilini aç`;
  const openUserProfile = () => renderProfile(user.id).catch(displayError);
  identity.addEventListener('click', openUserProfile);
  identity.addEventListener('keydown', (event) => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); openUserProfile(); } });
  row.append(identity, copy, actions);
  return row;
}

function openAdminCoinAmount(user, reload, mode) {
  const labels = {
    grant: ['Coin ver', 'Ne kadar vermek istiyorsun?'],
    take: ['Coin al', 'Ne kadar almak istiyoruz?'],
    debt: ['Borç', 'Ne kadar coin borç?']
  };
  const [title, promptText] = labels[mode] || labels.grant;
  const content = createElement('div');
  content.append(createElement('p', 'modal-copy', `${promptText} Mevcut bakiye: ${formatCoin(user.aa_coins || 0)} AA Coin.`));
  if (mode === 'debt') {
    content.append(createElement('p', 'field-note', 'Borç işleminde kullanıcının bakiyesi yetmezse hesap eksiye düşer. 1 ay içinde kapanmazsa sistem 15 gün ban uygular.'));
  }
  const form = createElement('form', 'auth-form');
  const amount = document.createElement('input');
  amount.type = 'number';
  amount.step = '0.1';
  amount.min = '0.1';
  amount.max = '1000000';
  amount.required = true;
  amount.placeholder = 'Örn. 500';
  const actions = createElement('div', 'modal-actions');
  const cancel = button(t('cancel'), 'ghost-button');
  cancel.addEventListener('click', closeModal);
  actions.append(cancel, button('Tamam', mode === 'grant' ? 'primary-button' : 'danger-button', 'submit'));
  form.append(amount, actions);
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const value = Number(amount.value);
    if (!Number.isFinite(value) || value <= 0) {
      toast('Geçerli bir coin miktarı yaz.', 'error');
      return;
    }
    if (mode === 'take' && value > Number(user.aa_coins || 0)) {
      toast('Kullanıcının bu kadar AA Coin bakiyesi yok.', 'error');
      return;
    }
    try {
      const result = await api('admin_adjust_coins', { method: 'POST', data: { user_id: user.id, mode, amount: value }, loading: true });
      closeModal();
      toast(result.message);
      reload();
    } catch (error) { displayError(error); }
  });
  content.append(form);
  openModal(`${user.username} · ${title}`, content, 'COIN İŞLEMİ');
  window.setTimeout(() => amount.focus(), 0);
}
