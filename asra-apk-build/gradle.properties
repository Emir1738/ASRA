org.gradle.jvmargs=-Xmx700m -XX:MaxMetaspaceSize=320m -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
# Bellek kısıtlı ortam: dosya sistemi izleyicisi ve yapılandırma önbelleği kapalı
org.gradle.vfs.watch=false
org.gradle.configuration-cache=false
# Kotlin derleyicisi Gradle JVM'i İÇİNDE çalışır: ikinci bir JVM açılmaz,
# böylece toplam bellek tek yığınla sınırlı kalır (dar ortamlarda OOM önlemi)
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
